<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Mapping System — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F8FC; --paper-alt:#E7F1FA; --ink:#0A2A43; --ink-soft:#4A6684; --ink-faint:#8FA8BF;
  --teal:#0B5FAE; --teal-deep:#052F57; --teal-pale:#DCEBFB;
  --pulse:#1E9BF0; --pulse-deep:#0B7CC4; --circuit:#3D6FE0;
  --card:#FFFFFF; --line:rgba(10,42,67,0.13); --line-soft:rgba(10,42,67,0.07);
  --shadow:0 1px 2px rgba(10,42,67,0.06), 0 8px 24px -12px rgba(10,42,67,0.18);
  --radius:14px; --font-display:'Sarabun',sans-serif; --font-body:'Sarabun',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.6; font-size:15px;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; color:var(--teal-deep); margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
.hidden{display:none !important;}

/* ---- layout shells ---- */
.app-shell{display:flex; min-height:100vh;}
.sidebar{width:250px; flex:none; background:var(--teal-deep); color:#fff; padding:20px 14px; display:flex; flex-direction:column; gap:3px;}
.sidebar .brand{font-family:var(--font-mono); font-size:12px; font-weight:700; padding:0 6px 16px; border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:12px;}
.sidebar .brand small{display:block; font-weight:400; opacity:.7; font-size:11px; margin-top:3px;}
.sidebar button.nav-item{width:100%; text-align:left; padding:9px 11px; border-radius:9px; font-size:13.5px; color:rgba(255,255,255,0.78); background:none; border:none;}
.sidebar button.nav-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
.sidebar button.nav-item.active{background:var(--teal); color:#fff; font-weight:600;}
.sidebar .section-label{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:rgba(255,255,255,.45); padding:14px 11px 4px;}
.main-col{flex:1; min-width:0;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:10;}
.content{padding:24px; max-width:1100px;}
.page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.page-head h2{font-size:21px;}
.lede{color:var(--ink-soft); font-size:13.5px; max-width:75ch; margin-bottom:20px;}

/* ---- buttons / chips ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; border:1px solid transparent; transition:.15s;}
.btn-primary{background:var(--teal); color:#fff;} .btn-primary:hover{background:var(--teal-deep);}
.btn-accent{background:var(--pulse); color:#fff;} .btn-accent:hover{background:var(--pulse-deep);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink-soft);} .btn-ghost:hover{border-color:var(--teal); color:var(--teal-deep);}
.btn-danger{background:#fff; border-color:#E8AFA0; color:#B8401F;} .btn-danger:hover{background:#FBEAE5;}
.btn-sm{padding:6px 12px; font-size:12px; border-radius:7px;}
.chip{font-family:var(--font-mono); font-size:10.5px; padding:2px 8px; border-radius:100px; background:var(--teal-pale); color:var(--teal-deep); font-weight:600; display:inline-block;}
.role-badge{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; padding:2px 7px; border-radius:100px; font-weight:700;}
.role-badge.admin{background:#DCEBFB; color:var(--pulse-deep);}
.role-badge.teacher{background:#EDE4FB; color:#6B3FBF;}
.role-badge.student{background:var(--teal-pale); color:var(--teal-deep);}

/* ---- cards / stats / tables ---- */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
.stat-card{background:#fff; border:1px solid var(--line); border-radius:11px; padding:15px;}
.stat-card .n{font-family:var(--font-mono); font-weight:700; font-size:24px; color:var(--teal);}
.stat-card .lbl{color:var(--ink-soft); font-size:11.5px; margin-top:3px;}
table.data-table{width:100%; border-collapse:collapse;}
table.data-table th{text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-faint); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--paper-alt);}
table.data-table td{padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
table.data-table tr:last-child td{border-bottom:none;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.empty-state{padding:28px; text-align:center; color:var(--ink-faint); font-size:13px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px;}
.field label{font-size:11px; font-weight:600; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase;}
.field input, .field select, .field textarea{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; background:#fff; color:var(--ink); outline:none;}
.field textarea{resize:vertical; min-height:60px;}
.error-box{background:#FBEAE5; border:1px solid #E8AFA0; color:#8A2E1B; padding:9px 13px; border-radius:9px; font-size:12.5px; margin-bottom:12px;}

/* ---- login ---- */
.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px; background:var(--paper);}
.login-card{width:100%; max-width:380px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:30px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--pulse-deep); font-weight:600;}

/* ---- modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,42,67,0.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal-box{background:#fff; border-radius:16px; padding:24px; width:100%; max-width:520px; max-height:86vh; overflow-y:auto;}
.modal-box h3{font-size:17px; margin-bottom:14px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid var(--line-soft); padding-top:12px;}

/* ---- skill chips ---- */
.skill-chip{font-family:var(--font-mono); font-size:11.5px; padding:5px 11px; border-radius:100px; font-weight:600; display:inline-block;}
.skill-chip.ok{background:var(--teal-pale); color:var(--teal-deep);}
.skill-chip.gap{background:#FBF3E3; color:#8A6300;}
.progress-bar-track{background:var(--paper-alt); border-radius:100px; height:8px; overflow:hidden;}
.progress-bar-fill{height:100%; background:var(--teal); border-radius:100px;}

/* ============ JOBSDB BOARD ============ */
.jobsdb-group{margin-bottom:26px;}
.jobsdb-group-title{font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:10px;}
.jobsdb-group-title::after{content:""; flex:1; height:1px; background:var(--line);}
.jobsdb-listing{background:#fff; border:1px solid var(--line); border-radius:11px; padding:14px 16px; margin-bottom:8px;}
.jobsdb-listing .role{font-weight:600; font-size:14px; color:var(--ink); margin-bottom:3px;}
.jobsdb-listing .meta{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:6px;}
.jobsdb-listing .snippet{font-size:13px; color:var(--ink-soft);}
.jobsdb-search-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--teal);
  border:1px solid var(--teal-pale); background:var(--teal-pale); padding:8px 14px; border-radius:100px; margin-top:4px;
}
.jobsdb-search-link:hover{background:var(--teal); color:#fff;}
.jobsdb-note{font-size:12px; color:var(--ink-faint); margin-top:16px;}

/* ============ CLO VIEWER ============ */
.clo-item{background:#fff; border:1px solid var(--line); border-radius:11px; padding:14px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start;}
.clo-ksec{
  flex:none; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:14px; color:#fff;
}
.clo-ksec.K{background:var(--circuit);} .clo-ksec.S{background:var(--teal);}
.clo-ksec.E{background:var(--pulse);} .clo-ksec.C{background:#C9970B;}
.clo-body{flex:1;}
.clo-text{font-size:14px; color:var(--ink); margin-bottom:6px;}
.clo-plo-chips{display:flex; gap:6px; flex-wrap:wrap;}
.clo-plo-chip{font-family:var(--font-mono); font-size:10.5px; background:var(--teal-pale); color:var(--teal-deep); padding:2px 8px; border-radius:100px; font-weight:600;}
.clo-empty{padding:30px; text-align:center; color:var(--ink-faint); font-size:14px; background:#fff; border:1px dashed var(--line); border-radius:12px;}
.clo-matrix-dot{width:9px; height:9px; border-radius:50%; background:var(--teal); display:inline-block;}

/* ============ ALLUVIAL DIAGRAM (PLO -> CLO/course group -> K-S-E-C) ============ */
.alluvial-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:22px;}
.alluvial-colheads{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:2px 0 6px;}
.alluvial-wrap{position:relative; overflow-x:auto;}
.alluvial-node-label{
  position:absolute; display:flex; align-items:center; font-size:11px; color:var(--ink); line-height:1.25;
  pointer-events:none; padding:0 4px;
}
.alluvial-node-label b{font-weight:700;}
.alluvial-node-label.col-mid{justify-content:center; text-align:center; font-size:10.5px; color:var(--ink-soft);}
.alluvial-node-label.col-right{justify-content:flex-start;}
.alluvial-node-rect{transition:opacity .15s;}
.alluvial-ribbon{transition:opacity .15s;}
.alluvial-hoverzone{cursor:pointer; pointer-events:all;}
.alluvial-dim .alluvial-ribbon{opacity:.08;}
.alluvial-dim .alluvial-ribbon.hl{opacity:.92;}
.alluvial-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:11px; color:var(--ink-soft);}
.alluvial-legend .lg-item{display:flex; align-items:center; gap:5px;}
.alluvial-legend .lg-dot{width:9px; height:9px; border-radius:3px; display:inline-block;}

/* ============ COURSE GRAPH ============ */
.cg-banner{
  background:var(--teal-pale); color:var(--teal-deep); font-size:13px; font-weight:500; padding:10px 16px;
  border-radius:10px; margin-bottom:16px;
}
.cg-toolbar{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:16px;}
.cg-toolbar-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0;}
.cg-toolbar-row:not(:last-child){border-bottom:1px solid var(--line-soft);}
.cg-toolbar-label{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.cg-viewtabs{display:flex; gap:6px; flex-wrap:wrap;}
.cg-viewtab{
  font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:9px; border:1px solid var(--line);
  background:var(--paper-alt); color:var(--ink-soft); cursor:pointer; transition:.15s;
}
.cg-viewtab:hover{border-color:var(--teal);}
.cg-viewtab.active{background:var(--teal-deep); color:#fff; border-color:var(--teal-deep);}
.cg-cat-chips{display:flex; gap:6px; flex-wrap:wrap;}
.cg-cat-chip{
  font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:100px; border:1.5px solid; cursor:pointer;
  background:#fff; transition:.15s; opacity:1;
}
.cg-cat-chip.off{opacity:0.35; background:var(--paper-alt);}
.cg-zoom-btn{
  width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer;
  font-size:14px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
}
.cg-zoom-btn:hover{border-color:var(--teal); color:var(--teal-deep);}
.cg-zoom-slider{width:110px;}
.cg-mini-btn{
  font-size:12px; font-weight:600; padding:7px 13px; border-radius:8px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); cursor:pointer;
}
.cg-mini-btn:hover:not(:disabled){border-color:var(--teal); color:var(--teal-deep);}
.cg-mini-btn:disabled{opacity:0.4; cursor:not-allowed;}
.cg-mini-btn.active{background:var(--pulse); color:#fff; border-color:var(--pulse);}

.cg-body{display:flex; gap:16px; align-items:flex-start;}
.cg-wrap{position:relative; overflow:auto; flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:12px; max-height:78vh;}
.cg-zoom-inner{position:relative; transform-origin:top left; padding:20px;}
.cg-svg{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;}
.cg-columns{display:flex; gap:30px; position:relative; z-index:2; min-width:1180px;}
.cg-col{flex:1 1 0; min-width:150px;}
.cg-col-head{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); text-align:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--line);}

.cg-node{
  position:relative; background:#fff; border:1.5px solid var(--line); border-left:5px solid var(--line);
  border-radius:9px; padding:9px 10px 10px; margin-bottom:16px; cursor:pointer; transition:.15s; font-size:11.5px; line-height:1.35;
}
.cg-node .badge{
  position:absolute; top:7px; right:7px; font-family:var(--font-mono); font-size:9.5px; font-weight:700;
  background:var(--paper-alt); color:var(--ink-faint); padding:1px 6px; border-radius:100px;
}
.cg-node .code{font-family:var(--font-mono); font-size:10px; color:var(--teal); font-weight:700; display:block; margin-bottom:2px; padding-right:26px;}
.cg-node .name{color:var(--ink); font-weight:600; display:block; margin-bottom:6px;}
.cg-node .plo-chips{display:flex; gap:3px; flex-wrap:wrap;}
.cg-plo-dot{
  width:16px; height:16px; border-radius:5px; font-family:var(--font-mono); font-size:8.5px; font-weight:700; color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.cg-node:hover{border-color:var(--teal); box-shadow:var(--shadow);}
.cg-node.dim{opacity:0.2;}
.cg-node.hi{box-shadow:0 0 0 2px rgba(30,155,240,0.25);}
.cg-node.selected{box-shadow:0 0 0 2.5px var(--pulse); border-color:var(--pulse);}
.cg-node.catoff{display:none;}
.cg-node-skill{background:#FAF8FF; border-left-color:#5B3FB0 !important;}
.cg-node-skill .imp-dots{font-family:var(--font-mono); font-size:10px; color:#5B3FB0; letter-spacing:1px; display:block; margin-bottom:2px;}
.cg-node-skill .soft-tag{display:inline-block; margin-top:5px; font-size:9.5px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.03em; color:#5B3FB0; background:#EDE7FB; padding:1.5px 6px; border-radius:100px;}

.cg-legend-panel{
  width:230px; flex:none; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px;
  font-size:12px; color:var(--ink-soft); position:sticky; top:76px;
}
.cg-legend-title{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; font-weight:700; color:var(--ink); margin-bottom:8px;}
.cg-legend-row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
.cg-legend-cat-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px;}
.cg-legend-swatch{width:13px; height:13px; border-radius:4px; flex:none;}
.cg-legend-note{font-size:11px; color:var(--ink-faint); margin-top:14px; line-height:1.5; padding-top:12px; border-top:1px solid var(--line-soft);}
.cg-hint{font-size:12px; color:var(--pulse-deep); font-weight:600;}
.cg-plo-popup{
  position:fixed; z-index:300; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 20px 50px -12px rgba(10,42,67,0.35);
  padding:18px 20px; max-width:340px; font-size:13px;
}
.cg-plo-popup .badge-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.cg-plo-popup .plo-badge{background:var(--pulse); color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px;}
.cg-plo-popup .plo-tag{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);}
.cg-plo-popup h4{font-size:15px; color:var(--ink); margin-bottom:10px; line-height:1.4;}
.cg-plo-popup p{color:var(--ink-soft); font-size:12.5px; margin-bottom:10px;}
.cg-plo-popup ul{margin:0 0 10px; padding-left:16px; font-size:12px; color:var(--ink-soft);}
.cg-plo-popup .close-btn{position:absolute; top:10px; right:12px; background:none; border:none; font-size:16px; color:var(--ink-faint); cursor:pointer;}
.cg-body.hidden-graph .cg-wrap, .cg-body.hidden-graph .cg-legend-panel{display:none;}
.cg-body.expanded .cg-wrap{max-height:none;}
@media (max-width:900px){
  .cg-body{flex-direction:column;}
  .cg-legend-panel{width:100%; position:static;}
}


/* ============ SIDEBAR LAYOUT ============ */
.app-shell-pub2{display:flex; align-items:flex-start; min-height:100vh;}
.pub-sidebar{
  width:264px; flex:none; background:#fff; border-right:1px solid var(--line);
  height:100vh; position:sticky; top:0; overflow-y:auto; padding:18px 14px; transition:width .18s ease, padding .18s ease;
}
.pub-sidebar.collapsed{width:0; padding:18px 0; overflow:hidden; border-right:none;}
.pub-sidebar-collapse-btn{
  display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; color:var(--ink-faint);
  background:none; border:none; padding:6px 8px; margin-bottom:10px; border-radius:8px; white-space:nowrap;
}
.pub-sidebar-collapse-btn:hover{background:var(--paper-alt); color:var(--ink-soft);}
.sb-home{
  display:block; font-weight:600; font-size:14.5px; color:var(--ink); padding:9px 10px; border-radius:9px; margin-bottom:8px; white-space:nowrap;
}
.sb-home:hover, .sb-home.active{background:var(--teal-pale); color:var(--teal-deep);}
.sb-group{margin-bottom:4px;}
.sb-group-head{
  display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
  padding:12px 10px 6px; white-space:nowrap;
}
.sb-group-head .n{background:var(--paper-alt); border-radius:100px; padding:1px 7px; font-size:10px;}
/* Generic hover tooltip — appears on mouseover, no click needed. Put text in data-tt and add class "tt". */
.tt{position:relative; cursor:default;}
.tt::after{
  content:attr(data-tt); position:absolute; left:50%; top:calc(100% + 7px); transform:translateX(-50%) translateY(-4px);
  background:#0A2A43; color:#fff; font-size:11.5px; font-family:var(--font-body); font-weight:500; line-height:1.4;
  white-space:nowrap; padding:6px 10px; border-radius:7px; opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .12s ease, transform .12s ease; z-index:60; box-shadow:0 6px 18px rgba(10,42,67,.28);
}
.tt::before{
  content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:5px solid transparent; border-bottom-color:#0A2A43;
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity .12s ease; z-index:60; margin-top:2px;
}
.tt:hover::after, .tt:hover::before{opacity:1; visibility:visible;}
.tt:hover::after{transform:translateX(-50%) translateY(0);}
.sb-item{
  display:block; width:100%; text-align:left; font-size:13.8px; color:var(--ink-soft); padding:8px 10px; border-radius:9px;
  background:none; border:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sb-item:hover{background:var(--paper-alt); color:var(--ink);}
.sb-item.active{background:var(--teal); color:#fff; font-weight:600;}
.sb-refs{
  display:block; margin-top:14px; font-size:13.5px; font-weight:600; color:var(--pulse-deep);
  background:#FBF3E3; border:1px solid #EAD9A8; padding:10px 12px; border-radius:10px; text-align:left; white-space:nowrap;
}
.sb-refs:hover{background:#F7ECD3;}
.pub-sidebar-open-btn{
  flex:none; width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff;
  color:var(--ink-soft); font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer;
}
.pub-sidebar-open-btn:hover{border-color:var(--teal); color:var(--teal-deep);}
.pub-sidebar-open-btn.show{display:flex;}
.main-col-pub{flex:1; min-width:0;}
@media (max-width:900px){
  .pub-sidebar{position:fixed; left:0; top:0; z-index:80; box-shadow:0 0 40px rgba(0,0,0,.15); width:264px;}
  .pub-sidebar.collapsed{width:0; box-shadow:none;}
  .pub-sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(10,42,67,0.35); z-index:70;}
  .pub-sidebar-scrim.show{display:block;}
}


/* ============ VIEW SWITCHING (explore hub) ============ */
.view-section{display:none;}
.view-section.active{display:block;}
.view-back{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12.5px; font-weight:600;
  color:var(--teal); background:none; border:none; cursor:pointer; margin-bottom:18px; padding:0;
}
.view-back:hover{color:var(--pulse-deep);}

/* ============ EXPLORE HUB ============ */
.hub-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.hub-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.hub-grid{grid-template-columns:1fr;}}
.hub-card{
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; text-align:left;
  cursor:pointer; transition:.15s; box-shadow:var(--shadow); font-family:var(--font-body);
}
.hub-card:hover{border-color:var(--teal); transform:translateY(-2px);}
.hub-card .hub-icon{
  width:34px; height:34px; border-radius:9px; background:var(--teal-pale); color:var(--teal-deep);
  display:flex; align-items:center; justify-content:center; margin-bottom:12px;
}
.hub-card h3{font-size:15px; margin-bottom:6px; color:var(--ink);}
.hub-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px; min-height:38px;}
.hub-card .hub-link{font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--teal);}

/* Reveal on scroll */
.reveal{opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease;}
.reveal.show{opacity:1; transform:none;}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  .reveal{opacity:1; transform:none; transition:none;}
}

.stu-hero{
  position:relative; overflow:hidden; border-radius:18px; padding:26px 28px;
  background:linear-gradient(120deg, var(--teal-deep) 0%, var(--teal) 65%, var(--pulse) 130%);
  color:#fff; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  margin-bottom:20px; box-shadow:var(--shadow);
}
.stu-hero::before{
  content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background:radial-gradient(circle at 88% 15%, rgba(255,255,255,0.16), transparent 45%),

.stu-hero-text{position:relative; z-index:1; min-width:220px;}
.stu-hero-text h2{color:#fff; font-size:22px; margin-bottom:6px;}

.stu-hero-meta b{font-family:var(--font-mono); font-size:15px; color:#fff;}

.stu-quick-card{
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; text-align:left;

.stu-quick-card p{font-size:12px; color:var(--ink-soft); margin:0; line-height:1.5;}

}
.stu-section-title h3{font-size:14.5px; margin:0;}

.status-badge{font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.status-badge.completed{background:#DFF3E6; color:#12793F;}
.status-badge.in_progress{background:#FDF0D2; color:#946200;}
.status-badge.planned{background:var(--paper-alt); color:var(--ink-faint);}
.status-badge.none{background:var(--paper-alt); color:var(--ink-faint); opacity:.7;}
.status-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

.grade-badge{font-family:var(--font-mono); font-weight:700; font-size:12.5px; padding:3px 9px; border-radius:8px; display:inline-block;}
.grade-badge.g-hi{background:#DFF3E6; color:#12793F;}
.grade-badge.g-mid{background:#DCEBFB; color:var(--teal-deep);}
.grade-badge.g-low{background:#FDF0D2; color:#946200;}
.grade-badge.g-fail{background:#FBE1DC; color:#B8321F;}

.stu-tab{
  font-size:12.5px; font-weight:600; padding:8px 15px; border-radius:100px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); cursor:pointer; transition:.15s;

.stu-tab.active{background:var(--teal-deep); color:#fff; border-color:var(--teal-deep);}

.stu-job-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:18px;}

  border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; background:#fff; cursor:pointer;
  transition:.15s; text-align:left; font-family:var(--font-body);
}

.stu-job-card.active{border-color:var(--teal-deep); background:var(--teal-pale);}
.stu-job-card .jt{font-size:13px; font-weight:600; color:var(--ink); display:block;}
.stu-job-card .jc{font-size:11px; color:var(--ink-faint); margin-top:2px; display:block;}

@media (max-width:640px){
  .stu-hero{flex-direction:column; align-items:flex-start;}
  .stu-hero-ring{width:100%; justify-content:space-between;}
}

 "SC-112-101", "credit_text": "3(2-2-5)", "th_name": "การเขียนโปรแกรม", "en_name": "Programming", "th_desc": "การเขียนโปรแกรมคอมพิวเตอร์ขั้นแนะนำ ผังงาน ซูโดโค้ด การแก้ปัญหา การคิดเชิงตรรกะ ชนิดข้อมูล ตัวแปร โครงสร้างควบคุม อาร์เรย์ ฟังก์ชัน การนำเข้า/การส่งออกไฟล์", "en_desc": "Introduction to computer programming: flowchart, pseudocode, problem solving, logical thinking, data types, variables, control structure, array, function, input/output, file", "group_code": "major-req", "year_no": 1, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 28, "code": "SC-112-102", "credit_text": "3(2-2-5)", "th_name": "แพลตฟอร์มเทคโนโลยี", "en_name": "Platform Technology", "th_desc": "ความรู้เบื้องต้นเกี่ยวกับสถาปัตยกรรมระบบคอมพิวเตอร์ เทคโนโลยีเครื่องคอมพิวเตอร์เสมือน ส่วนประกอบทางด้านฮาร์ดแวร์ หน่วยประมวลผล ระบบบัสภายในและระบบเชื่อมต่ออุปกรณ์ภายนอก หน่วยความจำ หน่วยเก็บบันทึกข้อมูล พื้นฐานระบบปฏิบัติการ การจัดการโปรเซส การจัดการหน่วยความจำ การจัดการกับหน่วยเก็บข้อมูล กรณีศึกษาระบบปฏิบัติการในปัจจุบัน", "en_desc": "Introduction to computer architecture; virtualization technology; computer hardware; central processing unit; internal and external bus system; system memory; storage unit; introduction to operating system; process management; memory management; storage management; case studies", "group_code": "major-req", "year_no": 1, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 29, "code": "SC-112-103", "credit_text": "3(2-2-5)", "th_name": "การจัดการระบบฐานข้อมูล", "en_name": "Database System Management", "th_desc": "แนวคิดของระบบฐานข้อมูล แฟ้มข้อมูลและฐานข้อมูล สถาปัตยกรรมของระบบฐานข้อมูล หน่วยข้อมูลและความสัมพันธ์ของหน่วยข้อมูล การออกแบบฐานข้อมูลด้วยวิธีแผนภาพอีอาร์ การออกแบบฐานข้อมูลด้วยวิธีนอร์มัลไลเซชัน โครงสร้างฐานข้อมูลแบบลำดับชั้น แบบเครือข่าย และแบบเชิงสัมพันธ์ คำสั่งภาษาเอสคิวแอล การจัดการฐานข้อมูลแบบ NoSQL การโปรแกรมในระบบการจัดการฐานข้อมูล", "en_desc": "Database system concepts; files and databases; database system architecture; data entities and relationships; data modeling using entity relation diagrams and normalization technique; hierarchical, network and relational models of databases; SQL language, database retrieval and definition languages; how to integrate database applications; NoSQL (not only SQL) database management; programming in database management systems", "group_code": "major-req", "year_no": 1, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 30, "code": "SC-112-104", "credit_text": "3(2-2-5)", "th_name": "ระบบปฏิบัติการ", "en_name": "Operating System", "th_desc": "พื้นฐานระบบปฏิบัติการในแพลตฟอร์มต่างๆ การติดตั้งระบบปฏิบัติการ คำสั่งการใช้งานพื้นฐาน การปรับตั้งค่า การจัดการกับบัญชีผู้ใช้งาน การจัดการกับไฟล์และแฟ้มข้อมูล การติดตั้งและใช้งานเครื่องให้บริการ การเชื่อมต่อและการทำงานบนเครื่องระยะไกล การปรับปรุงด้านความมั่นคง", "en_desc": "Introduction to operating systems; operating system installation; basic commands; configurations; account management; file and directory management; server services installation; connecting and working on remote machines; server hardening", "group_code": "major-req", "year_no": 1, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 31, "code": "SC-112-105", "credit_text": "3(3-0-6)", "th_name": "กฎหมายและจรรยาบรรณทางวิชาชีพเทคโนโลยีสารสนเทศ", "en_name": "Law and Ethics for Information Technology", "th_desc": "ความรู้เบื้องต้นทางกฎหมายเกี่ยวกับทรัพย์สินทางปัญญาและกฎหมายที่เกี่ยวกับเทคโนโลยีสารสนเทศ พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ.2562 การรับรองสถานะทางกฎหมายของข้อมูลทางอิเล็กทรอนิกส์ ลายมือชื่ออิเล็กทรอนิกส์และการรับรอง หลักเกณฑ์ในการจัดเก็บข้อมูลอิเล็กทรอนิกส์ที่ถูกต้องตามกฎหมาย การทำสัญญาที่มีข้อมูลเป็นอิเล็กทรอนิกส์ ธุรกิจบริการเกี่ยวกับธุรกรรมทางอิเล็กทรอนิกส์ แนวคิดและความสำคัญของจริยธรรมและปรัชญาแห่งวิชาชีพเทคโนโลยีสารสนเทศ", "en_desc": "Introduction to intellectual property laws and professional codes of conduct in information technology; Personal Data Protection Act B.E. 2562; certificates in digital information; digital signature and accreditation; principles of digital information collection by law; making contracts with digital information; digital information business; principles and significance of ethical issues in the information technology field; applying appropriate ethics to the IT profession", "group_code": "major-req", "year_no": 1, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 32, "code": "SC-112-201", "credit_text": "3(2-2-5)", "th_name": "การวิเคราะห์และออกแบบระบบสมัยใหม่", "en_name": "Modern System Analysis and Design", "th_desc": "หลักการวิเคราะห์และออกแบบระบบ วงจรการพัฒนาระบบ การบริหารโครงการ เครื่องมือสนับสนุนการพัฒนาระบบสมัยใหม่ แบบจำลองของระบบงาน การออกแบบระบบ การออกแบบผลลัพธ์ การออกแบบส่วนติดต่อผู้ใช้ กรณีศึกษา", "en_desc": "Study and practice of principles of system analysis and design; system development cycle; project management; modern system development support tools; model of work system; system design; output design; user interface design; case studies", "group_code": "major-req", "year_no": 2, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 33, "code": "SC-112-202", "credit_text": "3(2-2-5)", "th_name": "การเขียนโปรแกรมบนเว็บสมัยใหม่", "en_name": "Modern Dynamic Web Programming", "th_desc": "พื้นฐานการทำงานของเว็บแอปพลิเคชัน การติดตั้งโปรแกรมเว็บเซิร์ฟเวอร์ การออกแบบและพัฒนาเว็บโดยใช้เฟรมเวิร์กที่เป็นปัจจุบัน (HTML, CSS, JavaScript, Bootstrap) PHP และ jQuery หรือ React เวอร์ชันที่เป็นปัจจุบัน การบริหารจัดการฐานข้อมูลด้วย MySQL หรือ PostgreSQL, MongoDB, SQLite กรณีศึกษา", "en_desc": "The basics of web applications; installing a web server program; designing and developing the web using current framework tools (HTML, CSS, JavaScript, Bootstrap); PHP and jQuery or React up-to-date version; managing databases with MySQL or PostgreSQL, MongoDB, SQLite; case studies", "group_code": "major-req", "year_no": 2, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 34, "code": "SC-112-203", "credit_text": "3(2-2-5)", "th_name": "เครือข่ายคอมพิวเตอร์และความมั่นคง", "en_name": "Computer Network and Security", "th_desc": "สถาปัตยกรรมเครือข่ายคอมพิวเตอร์และโพรโทคอล แบบจำลองอ้างอิงโอเอสไอ เครือข่ายบริเวณเฉพาะที่และบริเวณกว้าง โพรโทคอลทีซีพี/ไอพีและอินเทอร์เน็ต พื้นฐานการกำหนดที่อยู่ การแบ่งเครือข่ายย่อยและการจัดเส้นทาง โปรแกรมประยุกต์ด้านเครือข่ายและบริการอินเทอร์เน็ต หลักความมั่นคงเบื้องต้น ประเภทภัยคุกคาม กลไกการโจมตีและการป้องกัน นโยบายและการปฏิบัติเพื่อความมั่นคงของระบบ", "en_desc": "Computer network architectures and protocols; OSI reference model; local area networks and wide area networks; TCP/IP protocol and the Internet; basics of addressing, subnetting and routing; network applications and internet services; basic security principles; types of attacks; attack mechanisms and defenses; security policies; authentication systems", "group_code": "major-req", "year_no": 2, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 35, "code": "SC-112-204", "credit_text": "3(2-2-5)", "th_name": "การจัดการโครงการ", "en_name": "Project Management", "th_desc": "ความหมายของโครงการและความสำคัญของการบริหารโครงการ การวางแผนการดำเนินงานของโครงการ การสร้างกลุ่มงาน การกำหนดขอบเขตและบทบาทของสมาชิกกลุ่ม การจัดกำหนดการและทรัพยากร การประมาณค่าใช้จ่ายของโครงการ การสร้างแผนงานด้วยตารางปฏิบัติงาน เช่น GANTT, PERT และ CPM การวิเคราะห์และการประเมินผลโครงการเพื่อการตัดสินใจและการควบคุม", "en_desc": "Project definition and significance of project management; project planning; project network and role of network members; project resource management; project cost estimation; using Gantt chart, PERT and CPM for project planning; project analysis and evaluation for decision making and monitoring", "group_code": "major-req", "year_no": 2, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 36, "code": "SC-112-205", "credit_text": "3(2-2-5)", "th_name": "การทำเหมืองข้อมูล", "en_name": "Data Mining", "th_desc": "แนวคิดในการทำเหมืองข้อมูล กระบวนการทำเหมืองข้อมูล การเตรียมข้อมูล อัลกอริทึมเกี่ยวกับการทำเหมืองข้อมูล โปรแกรมที่ใช้ทำเหมืองข้อมูล หลักการและวิธีการทำเหมืองข้อมูลด้วยการจำแนกข้อมูล การจัดกลุ่ม และการหากฎความสัมพันธ์ การประยุกต์ใช้งานและกรณีศึกษา", "en_desc": "Data mining concepts; data mining process; data preparation; algorithms on data mining; data mining programs; principles and methods of data mining with data classification, clustering and association rules mining; data mining applications and case studies", "group_code": "major-req", "year_no": 2, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 37, "code": "SC-112-206", "credit_text": "3(2-2-5)", "th_name": "ระบบสารสนเทศเพื่อการบริหารจัดการองค์กร", "en_name": "Information System for Organization Management", "th_desc": "แนวคิดเกี่ยวกับระบบสารสนเทศเพื่อการจัดการ โครงสร้างของระบบสารสนเทศเพื่อการจัดการ ระบบสารสนเทศในองค์กร เทคโนโลยีในระบบสารสนเทศ ระบบการจัดการและระบบสนับสนุนในองค์กร การลงทุนด้านเทคโนโลยี การรักษาความปลอดภัยระบบสารสนเทศ กรณีศึกษา", "en_desc": "Concepts of information systems management; structure of management information systems; information systems in organizations; technology in information systems; management and support systems in organizations; technology investment; information system security; case studies of information systems for managing and developing organizations", "group_code": "major-req", "year_no": 2, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 38, "code": "SC-112-207", "credit_text": "3(2-2-5)", "th_name": "การเขียนโปรแกรมขั้นสูง", "en_name": "Advance Programming", "th_desc": "หลักและแนวคิดการเขียนโปรแกรมเชิงวัตถุ การพัฒนาโปรแกรมส่วนหน้าบ้าน (Front-end) และส่วนหลังบ้าน (Back-end) การพัฒนาโปรแกรมอย่างเต็มรูปแบบ การออกแบบและพัฒนาด้วยจาวาสคริปต์เฟรมเวิร์ก เช่น Laravel, React, Node.js, AngularJS หรือภาษาที่นิยมใช้ในปัจจุบัน การบริหารจัดการฐานข้อมูลที่นิยมใช้ในปัจจุบัน", "en_desc": "Principles and concepts of object-oriented programming; front-end and back-end development; full-stack development; design and development with JavaScript frameworks such as Laravel, React, Node.js, AngularJS, or currently popular languages; managing currently used databases", "group_code": "major-req", "year_no": 2, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 39, "code": "SC-112-208", "credit_text": "3(2-2-5)", "th_name": "เวชระเบียนศาสตร์", "en_name": "Medical Record Science", "th_desc": "ความรู้เบื้องต้นของเวชระเบียน แบบฟอร์มทางงานเวชระเบียน การเรียงแบบฟอร์มตามมาตรฐานสากล วิธีการให้เลขที่ การเก็บรักษาเวชระเบียน การตรวจสอบคุณภาพของเวชระเบียน การจัดระบบเวชระเบียนผู้ป่วยนอกและผู้ป่วยใน การจัดทำดรรชนีข้อมูลทางการแพทย์ การเก็บรวบรวมและนำเสนอข้อมูล การจัดการเวชระเบียนสำหรับผู้บริหารโรงพยาบาล และการจัดทำรายงานประจำเดือนและประจำปี", "en_desc": "Overview of medical record; medical record forms; arranging forms according to international standards; methods for numbering; filing; medical record quality assurance; organizing medical record systems for outpatients and inpatients; medical indexing; collecting and presenting data; medical record management for hospital executives; and monthly and yearly reporting", "group_code": "major-req", "year_no": 2, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 40, "code": "SC-112-401", "credit_text": "3(0-9-5)", "th_name": "โครงงานเทคโนโลยีสารสนเทศทางการแพทย์ 1", "en_name": "Medical Information Technology Project 1", "th_desc": "โครงงานเทคโนโลยีสารสนเทศทางการแพทย์สำหรับนักศึกษาปี 4 การเขียนโครงงาน การศึกษาความเป็นไปได้ เหตุผลความจำเป็นในการจัดทำโครงงาน การประเมินงบประมาณ การจัดการตารางเวลาทำงาน การวิเคราะห์ออกแบบระบบงาน การนำเสนอผลการดำเนินงาน", "en_desc": "Medical information technology project for fourth-year students; writing project proposals; feasibility study; rationale and needs for the project; budget estimation; work scheduling; work system design analysis; project result presentation", "group_code": "major-req", "year_no": 4, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 41, "code": "SC-112-402", "credit_text": "3(0-9-5)", "th_name": "โครงงานเทคโนโลยีสารสนเทศทางการแพทย์ 2", "en_name": "Medical Information Technology Project 2", "th_desc": "โครงงานเทคโนโลยีสารสนเทศทางการแพทย์สำหรับนักศึกษาปี 4 การพัฒนาระบบงาน การติดตั้งและทดสอบระบบงาน การเขียนรายงานโครงงาน และการนำเสนอโครงงาน", "en_desc": "Medical information technology project for fourth-year students; work system development; setting up and testing the system; writing the project report and presentation", "group_code": "major-req", "year_no": 4, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 42, "code": "SC-113-301", "credit_text": "3(2-2-5)", "th_name": "ปัญญาประดิษฐ์", "en_name": "Artificial Intelligence", "th_desc": "แนวคิดเกี่ยวกับปัญญาประดิษฐ์ วิธีการแก้ปัญหาทางปัญญาประดิษฐ์แบบต่าง ๆ วิธีการค้นหาคำตอบและการวางแผนงาน การแทนความรู้ในการแก้ปัญหา การประยุกต์ในด้านต่าง ๆ เช่น ระบบผู้ชำนาญการด้านเกม การประมวลผลภาษาธรรมชาติ การพิสูจน์ทฤษฎีบท การควบคุมหุ่นยนต์", "en_desc": "Concepts of artificial intelligence; solving methods of different types of AI problems; methods of searching for solutions and planning; representation of knowledge to solve problems; applications in various fields such as game-specialist systems, natural language processing, theorem proving, robot control", "group_code": "track-a-req", "year_no": 3, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 43, "code": "SC-113-302", "credit_text": "3(2-2-5)", "th_name": "การประมวลผลภาษาธรรมชาติเบื้องต้น", "en_name": "Introduction to Natural Language Processing", "th_desc": "การประมวลผลภาษาธรรมชาติ พื้นฐานของทฤษฎีและแบบจำลองทางคณิตศาสตร์สำหรับการประมวลผลภาษาธรรมชาติ อัลกอริทึมและกระบวนการ บทบาทของการประมวลผลภาษาธรรมชาติและการประยุกต์ใช้", "en_desc": "Basics of Natural Language Processing (NLP); key concepts; levels of NLP; basic theories and mathematical models for NLP; algorithms and methods; their roles and NLP applications", "group_code": "track-a-req", "year_no": 3, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 44, "code": "SC-113-303", "credit_text": "3(2-2-5)", "th_name": "วิทยาศาสตร์ข้อมูลและการเรียนรู้ของเครื่อง", "en_name": "Data Science and Machine Learning", "th_desc": "วิทยาศาสตร์ข้อมูลเบื้องต้น สถิติเบื้องต้นสำหรับวิทยาศาสตร์ข้อมูล การจัดการและสำรวจข้อมูล การเตรียมและแปลงข้อมูล การแสดงผลข้อมูล แนวคิดการเรียนรู้ของเครื่อง การเรียนรู้แบบมีผู้สอนและไม่มีผู้สอน การจำแนก การจัดกลุ่ม การเลือกแบบจำลองและการประเมินผล การประยุกต์ใช้กับกรณีศึกษา", "en_desc": "Introduction to data science; basic statistics for data science; data management; exploratory data analysis; data preparation and transformation; data visualization; machine learning concepts; supervised and unsupervised learning; classification, clustering; model selection and evaluation; applying machine learning to case studies", "group_code": "track-a-req", "year_no": 3, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 45, "code": "SC-113-304", "credit_text": "3(2-2-5)", "th_name": "ระบบสมองกลฝังตัว", "en_name": "Embedded System", "th_desc": "ระบบสมองกลฝังตัว โดยเน้นที่การสื่อสารระหว่างระบบต่าง ๆ การเชื่อมต่อกับภายนอก การประหยัดพลังงาน ความมั่นคงและเสถียรภาพ หลักการออกแบบ วิธีการ เครื่องมือที่ใช้ออกแบบ และกรณีศึกษา", "en_desc": "Embedded systems, with emphasis on communication among distributed systems; interfacing with external environments; energy conservation; safety and reliability; the course covers design principles, methodologies, design tools, and case studies", "group_code": "track-a-req", "year_no": 3, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 46, "code": "SC-113-305", "credit_text": "3(2-2-5)", "th_name": "การเรียนรู้เชิงลึก", "en_name": "Deep Learning", "th_desc": "โครงข่ายประสาทเทียม พีชคณิตเชิงเ s for health; also includes applying AI and data analytics in forecasting the future in health", "group_code": "track-a-req", "year_no": 3, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 49, "code": "SC-113-308", "credit_text": "3(2-2-5)", "th_name": "การวิเคราะห์ข้อมูลเครือข่ายสังคมออนไลน์", "en_name": "Social Network Data Analytics", "th_desc": "ทฤษฎีและหลักการวิเคราะห์ข้อมูลบนสื่อสังคมออนไลน์เบื้องต้น วิธีการสกัดข้อมูลขนาดใหญ่จากสื่อสังคมออนไลน์ วิธีการวิเคราะห์ข้อความบนสื่อสังคมออนไลน์ การประยุกต์ใช้สำหรับองค์กรและธุรกิจ", "en_desc": "Introduction to theories and principles of data analysis on social media; extracting big data from social media; analyzing text on social media; applications for corporations and businesses", "group_code": "track-a-req", "year_no": 3, "sem_no": 2, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 58, "code": "SC-113-309", "credit_text": "3(2-2-5)", "th_name": "เทคโนโลยีคอมพิวเตอร์ทางการแพทย์", "en_name": "Medical Computer Technology", "th_desc": "พื้นฐานของการจัดองค์ประกอบและสถาปัตยกรรมระบบคอมพิวเตอร์ องค์ประกอบของคอมพิวเตอร์พื้นฐาน การแสดงผลของข้อมูล การจัดองค์ประกอบและสถาปัตยกรรมของหน่วยความจำ ระบบอุปกรณ์นำเข้าและแสดงผล หน่วยจัดเก็บข้อมูล หน่วยประมวลผลกลางและอุปกรณ์ต่อพ่วงที่ใช้ในสารสนเทศทางการแพทย์", "en_desc": "Fundamentals of computer organization and architecture; basic computer components; data representation; memory system organization and architecture; input and output systems; storage systems; CPU and additional computing units used in medical information", "group_code": "track-b-req", "year_no": 3, "sem_no": 1, "created_at": "2026-09-18 06:16:07", "updated_at": null}, {"id": 59, "code": "SC-113-310", "credit_text": "3(2-2-5)", "th_name": "ระบบสารสนเทศทางการแพทย์และสาธารณสุข", "en_name": "Medical and Public Health Information System", "th_desc": "ระบบสารสนเทศทางการแพทย์และสาธารณสุข งานเวชระเบียน งานพยาบาลหน้าห้องตรวจ งานห้องแพทย์ งานห้องผ่าตัด งานทันตกรรม งานหอผู้ป่วยใน งานคลั const memoryStore = {};
async function storeGet(key) {
  try {
    if (window.storage) { const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  } catch (e) { /* not found or unavailable */ }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
}
async function storeSet(key, value) {
  memoryStore[key] = value;
  try { if (window.storage) await window.storage.set(key, JSON.stringify(value), false); } catch (e) { /* ignore */ }
}
async function storeDelete(key) {
  delete memoryStore[key];
  try { if (window.storage) await window.storage.delete(key, false); } catch (e) { /* ignore */ }
}

function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---- shared visual helpers for the redesigned student pages ---- */
function ringSVG(percent, opts) {
  opts = opts || {};
  const size = opts.size || 46, stroke = opts.stroke || 5;
  const track = opts.track || 'var(--paper-alt)', fill = opts.fill || 'var(--teal)';
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - p / 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${fill}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}
const GRADE_POINTS_MAP = { 'A':4,'B+':3.5,'B':3,'C+':2.5,'C':2,'D+':1.5,'D':1,'F':0 };
function gradeBadgeHtml(grade) {
  if (!grade) return '<span style="font-size:12px; color:var(--ink-faint);">—</span>';
  const pt = GRADE_POINTS_MAP[grade];
  const cls = pt === undefined ? 'g-mid' : pt >= 3.5 ? 'g-hi' : pt >= 2.5 ? 'g-mid' : pt >= 1 ? 'g-low' : 'g-fail';
  return `<span class="grade-badge ${cls}">${escapeHtml(grade)}</span>`;

function pubSidebarHtml() {

function wirePubSidebar() {
  document.querySelectorAll('[data-pnav]').forEach(b => b.addEventListener('click', () => navigatePublic(b.dataset.pnav)));
  document.getElementById('pubCollapseBtn')?.addEventListener('click', () => {
    pubCollapsed = true;
    document.getElementById('pubSidebar').classList.add('collapsed');
    document.getElementById('pubSidebarOpenBtn').classList.add('show');
  });
  document.getElementById('pubSidebarOpenBtn')?.addEventListener('click', () => {
    pubCollapsed = false;
    document.getElementById('pubSidebar').classList.remove('collapsed');
    document.getElementById('pubSidebarOpenBtn').classList.remove('show');
  });
}

  app.innerHTML = `

/* ---------- รายวิชา ---------- */
function pubTeachingHistoryBlock(code) {
  const rows = (SEED.teaching_history || []).filter(t => t.course_code === code)
    .sort((a, b) => a.academic_year - b.academic_year || a.semester - b.semester);
  if (!rows.length) return '';
  return `<div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">
    <div class="eyebrow" style="font-size:9px; margin-bottom:5px;">ผู้สอนตามภาคการศึกษาที่ผ่านมา (อาจเปลี่ยนแปลงในแต่ละปีการศึกษา)</div>
    <table style="width:100%; font-size:11.5px; border-collapse:collapse;">
      <tbody>${rows.map(r => `<tr>
        <td style="padding:2px 8px 2px 0; font-family:var(--font-mono); color:var(--ink-faint); white-space:nowrap;">${r.academic_year}/${r.semester}</td>
        <td style="padding:2px 0; color:var(--ink-soft);">${r.teachers.map(escapeHtml).join(', ')}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}
// Distinct color per course group (หมวดวิชา), used on the filter chips and course cards so each
// category is recognizable by color, not just by reading the label text.
const GROUP_COLORS = {
  'ge-req': '#0B5FAE', 'ge-elec': '#3AA8E0', 'core': '#0F8A4C', 'major-req': '#5B3FB0',
  'track-a-req': '#C9970B', 'track-a-elec': '#E0B23A', 'track-b-req': '#D9534F', 'track-b-elec': '#E8897F',
  'internship': '#0A2A43', 'free-elec': '#6B7280',
};
function groupColor(code) { return GROUP_COLORS[code] || 'var(--ink-faint)'; }
function pubCourses(el) {
  el.innerHTML = `<div class="pub-content">${pubBackBtn()}
    <div class="eyebrow">คำอธิบายรายวิชา</div><h2 style="font-size:20px; margin:8px 0 12px;">สำรวจรายวิชา</h2>
    <input id="pubCourseSearch" placeholder="ค้นหารหัสวิชา หรือชื่อวิชา…" style="width:100%; padding:9px 14px; border:1px solid var(--line); border-radius:100px; margin-bottom:12px;">
    <div class="toolbar" id="pubFilterRow" style="margin-bottom:6px;">
      <button class="filter-chip-pub active" data-g="all">ทั้งหมด</button>
      ${SEED.groups.map(g => `<button class="filter-chip-pub" data-g="${g.code}" style="--g-color:${groupColor(g.code)};">${g.label}</button>`).join('')}
    </div>
    <div id="pubCourseCount" style="font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:10px;"></div>
    <div class="course-list-pub" id="pubCourseList"></div>
  </div>${pubFooter()}`;
  wireBack(el);
  let activeG = 'all', search = '';
  function drawCourses() {
    const filtered = SEED.courses.filter(c => {
      const mg = activeG === 'all' || c.group_code === activeG;
      const s = search.trim().toLowerCase();
      const ms = !s || c.code.toLowerCase().includes(s) || c.th_name.toLowerCase().includes(s);
      return mg && ms;
    });
    document.getElementById('pubCourseCount').textContent = `พบ ${filtered.length} รายวิชา จากทั้งหมด ${SEED.courses.length} รายวิชา`;
    const list = document.getElementById('pubCourseList');
    list.innerHTML = filtered.map(c => `
      <div class="course-card-pub" style="--g-color:${groupColor(c.group_code)};">
        <div class="course-head-pub" data-code="${c.code}">
          <div><span class="course-code-pub">${c.code}</span><span style="font-weight:600; font-size:13px;">${escapeHtml(c.th_name)}</span> <span style="font-style:italic; color:var(--ink-soft); font-size:11.5px;">${escapeHtml(c.en_name)}</span></div>
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);">${c.credit_text}</span>
        </div>
        <div class="course-body-pub hidden" data-body="${c.code}">
          <div><div class="eyebrow" style="font-size:9px; margin-bottom:5px;">คำอธิบาย (ไทย)</div><p style="font-size:12px; color:var(--ink-soft);">${escapeHtml(c.th_desc)}</p></div>
          <div><div class="eyebrow" style="font-size:9px; margin-bottom:5px;">English</div><p style="font-size:12px; color:var(--ink-soft);">${escapeHtml(c.en_desc)}</p></div>
          ${pubTeachingHistoryBlock(c.code)}
        </div>
      </div>`).join('');
    list.querySelectorAll('.course-head-pub').forEach(h => h.addEventListener('click', () => list.querySelector(`[data-body="${h.dataset.code}"]`).classList.toggle('hidden')));
  }
  document.getElementById('pubFilterRow').addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip-pub'); if (!btn) return;
    activeG = btn.dataset.g;
    document.querySelectorAll('#pubFilterRow .filter-chip-pub').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); drawCourses();
  });
  document.getElementById('pubCourseSearch').addEventListener('input', e => { search = e.target.value; drawCourses(); });
  drawCourses();
}

/* ---------- แผนการเรียน ---------- */
function pubPlan(el) {
  el.innerHTML = `<div class="pub-content">${pubBackBtn()}
    <div class="eyebrow">แผนการศึกษา</div><h2 style="font-size:20px; margin:8px 0 14px;">แผนการเรียน 4 ปี</h2>
    <div class="year-tabs-pub" id="planYearTabs">${[1,2,3,4].map(y => `<button class="year-tab-pub${y===1?' active':''}" data-y="${y}">ปีที่ ${y}</button>`).join('')}</div>
    <div id="planTrackRow" style="margin-bottom:16px;"></div>
    <div id="planBody"></div>
  </div>${pubFooter()}`;
  wireBack(el);
  let year = 1, track = 'a';
  function draw() {
    document.getElementById('planTrackRow').innerHTML = year >= 3 ? `
      <button class="track-btn-pub${track==='a'?' active':''}" data-t="a">แขนง A · วิทยาการข้อมูลและ AI ทางการแพทย์</button>
      <button class="track-btn-pub${track==='b'?' active':''}" data-t="b">แขนง B · เทคโนโลยีสารสนเทศทางการแพทย์</button>` : '';
    document.querySelectorAll('#planTrackRow [data-t]').forEach(b => b.addEventListener('click', () => { track = b.dataset.t; draw(); }));
    const sems = [1, 2].map(sem => {
      const rows = SEED.study_plan.filter(i => i.year_no === year && i.sem_no === sem && (year < 3 || !i.track || i.track === track))
        .sort((a, b) => a.sort_order - b.sort_order);
      const total = rows.reduce((sum, r) => {
        const txt = r.course_code ? r.course_credit_text : r.custom_credit;
        const m = /^(\d+)/.exec(txt || ''); return sum + (m ? Number(m[1]) : 0);
      }, 0);
      return `<div style="margin-bottom:22px;">
        <h4 style="font-family:var(--font-mono); font-size:12px; color:var(--teal-deep); text-transform:uppercase; margin-bottom:8px;">ภาคการศึกษาที่ ${sem}</h4>
        <table class="data-table" style="background:#fff; border-radius:9px; width:100%;">
          <thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา</th><th>น(ท-ป-ศ)</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td style="font-family:var(--font-mono); font-size:11px; color:var(--teal);">${r.course_code || '—'}</td><td>${escapeHtml(r.course_code ? r.course_th_name : r.custom_name)}</td><td style="font-family:var(--font-mono); font-size:11px; text-align:right;">${escapeHtml(r.course_code ? r.course_credit_text : r.custom_credit)}</td></tr>`).join('')}</tbody>
        </table>
        <div style="text-align:right; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-top:6px;">รวม ${total} หน่วยกิต</div>
      </div>`;
    }).join('');
    document.getElementById('planBody').innerHTML = sems;
  }
  document.querySelectorAll('#planYearTabs [data-y]').forEach(b => b.addEventListener('click', () => {
    year = Number(b.dataset.y);
    document.querySelectorAll('#planYearTabs .year-tab-pub').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); draw();
  }));
  draw();
}

  body.querySelectorAll('[data-jobsel]').forEach(b => b.addEventListener('click', () => { careerGraphJobId = Number(b.dataset.jobsel); renderCareerGraphView(body); }));
  drawCareerGraph();
}
function drawCareerGraph() {
  const job = STATE.jobs.find(j => j.id === careerGraphJobId);
  const colWrap = document.getElementById('cgcColumns');
  if (!job || !colWrap) return;
  const reqSkillRows = STATE.jobSkills.filter(m => m.job_id === job.id);
  const neededSkillIds = new Set(reqSkillRows.map(m => m.skill_id));
  const relevantCS = STATE.courseSkills.filter(cs => neededSkillIds.has(cs.skill_id));
  const relevantCodes = new Set(relevantCS.map(cs => cs.course_code));
  const coursesByYear = {};
  relevantCodes.forEach(code => {
    const c = COURSE_LOOKUP[code]; if (!c) return;
    const y = c.year_no || 0;
    (coursesByYear[y] = coursesByYear[y] || []).push(c);
  });
  const years = Object.keys(coursesByYear).sort();
  const skillsSorted = reqSkillRows
    .map(m => ({ ...m, skill: STATE.skills.find(s => s.id === m.skill_id) }))
    .filter(m => m.skill)
    .sort((a, b) => b.importance - a.importance);

  colWrap.innerHTML = years.map(y => `
    <div class="cg-col" style="min-width:170px;">
      <div class="cg-col-head">${y == 0 ? 'ไม่ระบุปี' : 'ปีที่ ' + y}</div>
      ${coursesByYear[y].map(c => `<div class="cg-node" id="cgcnode-${c.code}" style="border-left-color:${GROUP_COLOR_PUB[c.group_code] || 'var(--line)'};">
        <span class="code">${c.code}</span><span class="name">${escapeHtml(c.th_name)}</span>
      </div>`).join('')}
    </div>`).join('') + `
    <div class="cg-col" style="min-width:210px;">
      <div class="cg-col-head">ทักษะที่จำเป็น</div>
      ${skillsSorted.map(s => `<div class="cg-node cg-node-skill" id="cgcnode-SKILL${s.skill_id}">
        <span class="imp-dots">${'●'.repeat(s.importance)}${'○'.repeat(5 - s.importance)}</span>
        <span class="name">${escapeHtml(s.skill.name)}</span>
        ${s.skill.skill_type === 'general' ? '<span class="soft-tag">General / Soft Skill</span>' : ''}
      </div>`).join('') || '<div class="empty-state" style="font-size:12px;">ยังไม่มีข้อมูลทักษะ</div>'}
    </div>` + `
    <div class="cg-col" style="min-width:190px;">
      <div class="cg-col-head">อาชีพ</div>
      <div class="cg-node" id="cgcnode-JOB${job.id}" style="border-left-color:var(--pulse); border-width:2px;">
        <span class="code">ตำแหน่งงาน</span><span class="name">${escapeHtml(job.title)}</span>
        <div style="font-size:10.5px; color:var(--ink-faint); margin-top:4px;">${relevantCodes.size} รายวิชาที่เกี่ยวข้อง · ${skillsSorted.length} ทักษะที่ต้องใช้</div>
      </div>
    </div>`;
  requestAnimationFrame(() => {
    const svg = document.getElementById('cgcSvg'), zi = document.getElementById('cgcZoomInner');
    if (!svg || !zi) return;
    svg.setAttribute('width', zi.scrollWidth); svg.setAttribute('height', zi.scrollHeight); svg.innerHTML = '';
    // ชั้น 1: รายวิชา -> ทักษะ (น้ำหนักทักษะของวิชานั้น)
    relevantCS.forEach(cs => {
      const fromEl = document.getElementById(`cgcnode-${cs.course_code}`);
      const toEl = document.getElementById(`cgcnode-SKILL${cs.skill_id}`);
      if (!fromEl || !toEl) return;
      const fr = cgOffsetRel(fromEl, zi), tr = cgOffsetRel(toEl, zi);
      const x1 = fr.x + fr.w, y1 = fr.y + fr.h / 2, x2 = tr.x, y2 = tr.y + tr.h / 2, midX = (x1 + x2) / 2;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`);
      path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#2F5FE0');
      path.setAttribute('stroke-width', String(0.8 + cs.weight * 0.3));
      path.setAttribute('opacity', String(0.22 + cs.weight * 0.07));
      svg.appendChild(path);
    });
    // ชั้น 2: ทักษะ -> อาชีพ (ความสำคัญของทักษะต่ออาชีพ)
    const jobEl = document.getElementById(`cgcnode-JOB${job.id}`);
    if (jobEl) {
      const jr = cgOffsetRel(jobEl, zi);
      skillsSorted.forEach(s => {
        const fromEl = document.getElementById(`cgcnode-SKILL${s.skill_id}`);
        if (!fromEl) return;
        const fr = cgOffsetRel(fromEl, zi);
        const x1 = fr.x + fr.w, y1 = fr.y + fr.h / 2, x2 = jr.x, y2 = jr.y + jr.h / 2, midX = (x1 + x2) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`);
        path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#DB2777');
        path.setAttribute('stroke-width', String(0.8 + s.importance * 0.35));
        path.setAttribute('opacity', String(0.3 + s.importance * 0.1));
        svg.appendChild(path);
      });
    }
  });
}
function renderCareerPathwayCard(itemText, job) {
  const cardId = 'career-' + Math.random().toString(36).slice(2, 9);
  if (!job) {
    // No structured Skill Mapping entry for this career yet (e.g. civil-service roles without a defined skill profile)
    return `<div class="career-card-pub" style="margin-bottom:10px;"><h3 style="font-size:14px;">${escapeHtml(itemText)}</h3>
      <p style="font-size:12px; color:var(--ink-faint);">ยังไม่มีข้อมูล Skill Mapping สำหรับอาชีพนี้ในระบบ</p></div>`;
  }
  const reqSkills = STATE.jobSkills.filter(m => m.job_id === job.id)
    .map(m => ({ ...m, skill: STATE.skills.find(s => s.id === m.skill_id) })).filter(m => m.skill)
    .sort((a, b) => b.importance - a.importance);
  const neededSkillIds = new Set(reqSkills.map(r => r.skill_id));
  const coursesByYear = {};
  STATE.courseSkills.forEach(cs => {
    if (!neededSkillIds.has(cs.skill_id)) return;
    const c = COURSE_LOOKUP[cs.course_code]; if (!c) return;
    const y = c.year_no || 0;
    if (!coursesByYear[y]) coursesByYear[y] = new Map();
    if (!coursesByYear[y].has(c.code)) coursesByYear[y].set(c.code, { course: c, skills: [] });
    coursesByYear[y].get(c.code).skills.push(STATE.skills.find(s => s.id === cs.skill_id)?.name);
  });
  const years = Object.keys(coursesByYear).sort();
  return `<div class="career-card-pub" style="margin-bottom:10px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
      <div><h3 style="font-size:14px; margin-bottom:4px;">${escapeHtml(job.title)}</h3>
      <p style="font-size:12px; color:var(--ink-soft);">${escapeHtml(job.responsibilities || '')}</p></div>
      <button class="btn btn-ghost btn-sm" data-career-toggle="${cardId}" style="flex:none;">ดูเส้นทางรายวิชา →</button>
    </div>
    <div id="${cardId}" class="hidden" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft);">
      <div style="font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;">ทักษะที่จำเป็น</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">
        ${reqSkills.map(r => `<span class="chip" style="background:var(--paper-alt); color:var(--ink-soft);">${escapeHtml(r.skill.name)} ${'●'.repeat(r.importance)}${'○'.repeat(5-r.importance)}</span>`).join('') || '<span style="font-size:12px; color:var(--ink-faint);">ยังไม่มีข้อมูล</span>'}
      </div>
      ${years.length ? `<div style="font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;">เส้นทางรายวิชาที่เกี่ยวข้อง (จัดตามปีที่เรียน)</div>
      <div style="display:grid; grid-template-columns:repeat(${Math.min(years.length,4)},1fr); gap:10px;">
        ${years.map(y => `<div>
          <div style="font-family:var(--font-mono); font-size:11px; color:var(--teal-deep); font-weight:700; margin-bottom:6px;">${y == 0 ? 'ไม่ระบุปี' : 'ปีที่ ' + y}</div>
          ${[...coursesByYear[y].values()].map(v => `<div style="background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:11.5px;">
            <div style="font-family:var(--font-mono); color:var(--teal); font-weight:700; font-size:10px;">${v.course.code}</div>
            <div>${escapeHtml(v.course.th_name)}</div>
          </div>`).join('')}
        </div>`).join('')}
      </div>` : '<p style="font-size:12px; color:var(--ink-faint);">ยังไม่มีรายวิชาที่เชื่อมโยงกับทักษะของอาชีพนี้ในระบบ</p>'}
    </div>
  </div>`;
}

const KSEC_LABEL_PUB = { K: 'Knowledge', S: 'Skills', E: 'Ethics', C: 'Characteristics' };
function closForCourse(code) {

/* ---------- Alluvial diagram (generic N-column ribbon flow) ---------- */
/* ทุกความสัมพันธ์คำนวณจากข้อมูล CLO จริงในระบบ (SEED.clos: plo_json + ksec + course_code -> group_code) ไม่มีข้อมูลสมมติ */
const PLO_FLOW_COLORS = ['#052F57', '#0B5FAE', '#1E9BF0', '#5B3FB0', '#B8630F', '#0F8A4C'];
const KSEC_FLOW_COLORS = { K: '#3D6FE0', S: '#0B5FAE', E: '#1E9BF0', C: '#C9970B' };
function ploColor(no) { return PLO_FLOW_COLORS[(Number(no) - 1) % PLO_FLOW_COLORS.length]; }

function computeNodeColor(col, id, idx) {
  return typeof col.color === 'function' ? col.color(id, idx) : (col.color || '#5B6B7D');
}

/* cols: [{key, idPrefix, title, order:[ids], color(id,idx), label(id,v)->html, tooltip(id,v)->text, outgoingRibbonColor:'self'|'next'}]
   rows: [{ [col.key]: nodeId, ... }] — one row per underlying real data unit (here: one row per CLO×PLO pair) */
function renderAlluvialGeneric(cols, rows, opts) {
  opts = opts || {};
  const W = opts.width || 1040, nodeW = 14, headerH = 30, chartH = opts.height || 480, pad = 8, rightMargin = 24, leftMargin = 14;
  const n = cols.length;
  const usableW = W - leftMargin - rightMargin - nodeW;
  const colX = cols.map((c, i) => leftMargin + (n === 1 ? 0 : Math.round(usableW * i / (n - 1))));

  const total = rows.length;
  const maxN = Math.max(...cols.map(c => c.order.length));
  const scale = (chartH - pad * (maxN - 1)) / total;

  const colTotals = cols.map(c => {
    const t = {}; c.order.forEach(id => t[id] = 0);
    rows.forEach(r => { const id = r[c.key]; if (id in t) t[id]++; });
    return t;
  });
  function layoutColumn(order, totals) {
    const cnt = order.length;
    const contentH = total * scale + pad * (cnt - 1);
    let y = headerH + (chartH - contentH) / 2;
    const layout = {};
    order.forEach(id => {
      const v = totals[id] || 0;
      const h = Math.max(v * scale, v > 0 ? 1.5 : 0);
      layout[id] = { y, h, v };
      y += h + pad;
    });
    return layout;
  }
  const colLayouts = cols.map((c, i) => layoutColumn(c.order, colTotals[i]));

  function ribbonPath(x1, x2, sY, tY, h) {
    const midX = (x1 + x2) / 2;
    return `M ${x1},${sY} C ${midX},${sY} ${midX},${tY} ${x2},${tY} L ${x2},${tY + h} C ${midX},${tY + h} ${midX},${sY + h} ${x1},${sY + h} Z`;
  }

  let ribbons = '', nodeRects = '', labels = '', headerText = '';

  for (let i = 0; i < n - 1; i++) {
    const colA = cols[i], colB = cols[i + 1];
    const layoutA = colLayouts[i], layoutB = colLayouts[i + 1];
    const srcCursor = {}; colA.order.forEach(id => srcCursor[id] = layoutA[id].y);
    const tgtCursor = {}; colB.order.forEach(id => tgtCursor[id] = layoutB[id].y);
    colA.order.forEach((a, ai) => {
      colB.order.forEach((b, bi) => {
        const v = rows.filter(r => r[colA.key] === a && r[colB.key] === b).length;
        if (!v) return;
        const h = v * scale;
        const sY = srcCursor[a], tY = tgtCursor[b];
        srcCursor[a] += h; tgtCursor[b] += h;
        const colorSrc = computeNodeColor(colA, a, ai);
        const colorTgt = computeNodeColor(colB, b, bi);
        const color = colA.outgoingRibbonColor === 'next' ? colorTgt : colorSrc;
        const x1 = colX[i] + nodeW, x2 = colX[i + 1];
        const tipA = colA.tooltip ? colA.tooltip(a, layoutA[a].v) : String(a);
        const tipB = colB.tooltip ? colB.tooltip(b, layoutB[b].v) : String(b);
        ribbons += `<path class="alluvial-ribbon" data-endpoints="${colA.idPrefix}-${a} ${colB.idPrefix}-${b}" d="${ribbonPath(x1, x2, sY, tY, h)}" fill="${color}" fill-opacity="0.38"><title>${escapeHtml(String(tipA))} → ${escapeHtml(String(tipB))} · ${v} CLO</title></path>`;
      });
    });
  }

  cols.forEach((c, i) => {
    headerText += `<text x="${colX[i]}" y="16" font-size="11" font-weight="700" fill="var(--ink-faint)" font-family="var(--font-mono)">${escapeHtml(c.title)}</text>`;
    const layout = colLayouts[i];
    const labelWidth = i === n - 1 ? (W - (colX[i] + nodeW + 6) - 4) : (colX[i + 1] - (colX[i] + nodeW) - 12);
    c.order.forEach((id, idx) => {
      const { y, h, v } = layout[id];
      const color = computeNodeColor(c, id, idx);
      nodeRects += `<rect class="alluvial-node-rect" data-node="${c.idPrefix}-${id}" x="${colX[i]}" y="${y}" width="${nodeW}" height="${h}" rx="2" fill="${color}"><title>${escapeHtml(c.tooltip ? String(c.tooltip(id, v)) : String(id))}</title></rect>`;
      labels += `<div class="alluvial-node-label" data-node="${c.idPrefix}-${id}" style="left:${colX[i] + nodeW + 6}px; top:${y}px; width:${labelWidth}px; height:${Math.max(h, 20)}px; text-align:left; justify-content:flex-start;"><span>${c.label(id, v)}</span></div>`;
    });
  });

  const svgH = headerH + chartH + 10;
  return `
    <div class="alluvial-wrap" id="${opts.wrapId || 'alluvialWrap'}" style="width:${W}px; height:${svgH}px; min-width:${W}px;">
      <svg width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}">
        ${headerText}
        <g>${ribbons}</g>
        <g>${nodeRects}</g>
      </svg>
      ${labels}
    </div>`;
}

function ploGroupKsecColumns() {
  const rows = [];
  SEED.clos.forEach(c => {
    const course = COURSE_LOOKUP[c.course_code];
    const grp = (course && course.group_code) || 'other';
    let plos = [];
    try { plos = JSON.parse(c.plo_json || '[]'); } catch (e) { /* skip */ }
    plos.forEach(p => rows.push({ plo: p, group: grp, ksec: c.ksec }));
  });
  const ploOrder = SEED.plos.map(p => p.no).filter(no => rows.some(r => r.plo === no));
  const groupLabel = Object.fromEntries(SEED.groups.map(g => [g.code, g.label]));
  const groupOrder = SEED.groups.filter(g => rows.some(r => r.group === g.code)).sort((a, b) => a.sort_order - b.sort_order).map(g => g.code);
  const ksecOrder = ['K', 'S', 'E', 'C'].filter(k => rows.some(r => r.ksec === k));
  const cols = [
    {
      key: 'plo', idPrefix: 'plo', title: '① PLO', order: ploOrder, outgoingRibbonColor: 'self',
      color: (id, idx) => PLO_FLOW_COLORS[idx % PLO_FLOW_COLORS.length],
      label: (id, v) => `<b>PLO ${id}</b> · ${v} CLO`,
      tooltip: (id, v) => { const plo = SEED.plos.find(x => x.no === id); return `PLO ${id}: ${plo ? plo.title : ''} — ${v} CLO`; },
    },
    {
      key: 'group', idPrefix: 'grp', title: '② กลุ่มรายวิชาของ CLO', order: groupOrder, outgoingRibbonColor: 'next',
      color: () => '#5B6B7D',
      label: (id, v) => `${escapeHtml(groupLabel[id] || id)} <b style="color:var(--ink-faint); font-weight:600;">· ${v} CLO</b>`,
      tooltip: (id, v) => `${groupLabel[id] || id} — ${v} CLO`,
    },
    {
      key: 'ksec', idPrefix: 'ksec', title: '③ K-S-E-C', order: ksecOrder,
      color: (id) => KSEC_FLOW_COLORS[id],
      label: (id, v) => `<b>${id}</b> · ${KSEC_LABEL_PUB[id]} (${v})`,
      tooltip: (id, v) => `${id} — ${KSEC_LABEL_PUB[id]} — ${v} CLO`,
    },
  ];
  return { cols, rows };
}

let alluvialActiveView = 'plo-group-ksec';

function renderAlluvialSection() {
  const view = ALLUVIAL_VIEWS.find(v => v.key === alluvialActiveView) || ALLUVIAL_VIEWS[0];
  const { cols, rows } = view.build();
  if (!rows.length) return '<div class="clo-empty">ยังไม่มีข้อมูล CLO ในระบบสำหรับสร้างแผนภาพ</div>';
  const chartHtml = renderAlluvialGeneric(cols, rows, { wrapId: 'alluvialWrap' });

      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">เลือกมุมมองเพื่อดูว่าแต่ละองค์ประกอบเชื่อมกันอย่างไร — ทุกความสัมพันธ์คำนวณจากข้อมูล CLO จริงในระบบ (มุมมองที่ต้องใช้ข้อมูล Need/ชุดทักษะซึ่งหลักสูตรยังไม่ได้กำหนดไว้ ยังไม่เปิดให้ดูในตอนนี้)</p>
      <div class="stu-tab-row" id="alluvialTabs">
        ${ALLUVIAL_VIEWS.map(v => `<button class="stu-tab ${v.key === alluvialActiveView ? 'active' : ''}" data-view="${v.key}">${v.label}</button>`).join('')}
      </div>
      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:14px;">${view.desc(rows.length)} — ชี้เมาส์ที่แต่ละแท่งเพื่อไล่ดูเส้นทางที่เกี่ยวข้อง</p>
      ${chartHtml}
      <div class="alluvial-legend">
        ${ploCol.order.map((id, idx) => `<span class="lg-item"><span class="lg-dot" style="background:${ploCol.color(id, idx)};"></span>PLO ${id}</span>`).join('')}
        <span style="width:1px; height:12px; background:var(--line); display:inline-block; margin:0 2px;"></span>
        ${ksecCol.order.map(id => `<span class="lg-item"><span class="lg-dot" style="background:${ksecCol.color(id)};"></span>${id} · ${KSEC_LABEL_PUB[id]}</span>`).join('')}
      </div>
    </div>`;
}
function wireAlluvialHover(root) {
  const wrap = root.querySelector('#alluvialWrap');
  if (!wrap) return;
  const onEnter = (id) => {
    wrap.classList.add('alluvial-dim');
    wrap.querySelectorAll(`.alluvial-ribbon[data-endpoints~="${id}"]`).forEach(r => r.classList.add('hl'));
  };
  const onLeave = () => {
    wrap.classList.remove('alluvial-dim');
    wrap.querySelectorAll('.alluvial-ribbon.hl').forEach(r => r.classList.remove('hl'));
  };
  wrap.querySelectorAll('[data-node]').forEach(elm => {
    elm.style.pointerEvents = 'all';
    elm.addEventListener('mouseenter', () => onEnter(elm.dataset.node));
    elm.addEventListener('mouseleave', onLeave);
  });
}
function wireAlluvialSection(root) {
  wireAlluvialHover(root);
  const tabs = root.querySelector('#alluvialTabs');
  if (!tabs) return;
  tabs.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.view === alluvialActiveView) return;
    alluvialActiveView = b.dataset.view;
    const card = root.querySelector('.alluvial-card');
    if (card) { card.outerHTML = renderAlluvialSection(); wireAlluvialSection(root); }
  }));
}

    <div style="overflow-x:auto;"><table class="data-table" style="background:#fff; min-width:640px;">
      <thead><tr><th>หมวด</th><th>สัดส่วนใน CLO</th><th>กลยุทธ์การสอนหลัก</th><th>วิธีการประเมินหลัก</th></tr></thead>
      <tbody>${KSEC_ROWS_PUB.map(r => `<tr><td><span class="clo-ksec ${r.k}" style="display:inline-flex; margin-right:8px;">${r.k}</span>${r.label}</td><td style="font-family:var(--font-mono); font-size:11.5px;">${ksecCounts[r.k]||0} ข้อ (${Math.round(((ksecCounts[r.k]||0)/ksecTotal)*100)}%)</td><td>${r.teach}</td><td>${r.assess}</td></tr>`).join('')}</tbody>

function cgAllPlos(code) {
  const rows = closForCourse(code);
  const set = new Set(); rows.forEach(c => c.plo.forEach(p => set.add(p)));
  return [...set].sort();
}
function cgPrimaryPlo(code) { const p = cgAllPlos(code); return p.length ? p[0] : 2; }
function cgVisibleNodes() { return CG_NODES_PUB.filter(n => (n.track === null || n.track === cgTrack) && !cgCatOff.has(n.cat)); }
function cgColumns() {
  if (cgViewMode === 'group') return CG_CATEGORIES_PUB.filter(c => c.key !== 'track-a' && c.key !== 'track-b')
    .concat([{ key: cgTrack === 'a' ? 'track-a' : 'track-b', label: cgTrack === 'a' ? 'แขนง A' : 'แขนง B' }]).map(c => ({ key: c.key, label: c.label }));
  if (cgViewMode === 'plo') return [1,2,3,4,5].map(p => ({ key: 'plo'+p, label: 'PLO '+p }));
  return CG_SEM_COLUMNS_PUB;
}
function cgNodeColKey(n) { if (cgViewMode === 'group') return n.cat; if (cgViewMode === 'plo') return 'plo'+cgPrimaryPlo(n.code); return n.col; }
function cgOffsetRel(el, ancestor) { let x=0,y=0,node=el,g=0; while(node && node!==ancestor && g<20){x+=node.offsetLeft;y+=node.offsetTop;node=node.offsetParent;g++;} return {x,y,w:el.offsetWidth,h:el.offsetHeight}; }
function cgChain(code) {
  const fwd = {}, bwd = {};
  SEED.prereqs.forEach(e => { (fwd[e.from_code]=fwd[e.from_code]||[]).push(e.to_code); (bwd[e.to_code]=bwd[e.to_code]||[]).push(e.from_code); });
  const visited = new Set([code]); let q = [code];
  while (q.length) { const next=[]; q.forEach(c => (fwd[c]||[]).forEach(t => { if(!visited.has(t)){visited.add(t); next.push(t);} })); q = next; }
  q = [code];
  while (q.length) { const next=[]; q.forEach(c => (bwd[c]||[]).forEach(f => { if(!visited.has(f)){visited.add(f); next.push(f);} })); q = next; }
  return visited;
}

      return `<div class="cg-node${dim?' dim':''}${inChain&&!isSel?' hi':''}${isSel?' selected':''}${hideByIso?' catoff':''}" id="cgnode-${n.code}" data-code="${n.code}" style="border-left-color:${CG_CAT_COLOR_PUB[n.cat]};">
        <span class="badge">${semBadge}</span><span class="code">${n.code}</span><span class="name">${c.th_name}</span>
        <span class="plo-chips">${plos.map(p => `<span class="cg-plo-dot" data-plo="${p}" style="background:${CG_PLO_COLORS_PUB[p]}">${p}</span>`).join('')}</span></div>`;
    }).join('');
    return `<div class="cg-col"><div class="cg-col-head">${col.label}</div>${html}</div>`;
  }).join('');
  requestAnimationFrame(cgDrawEdges);
}
function cgDrawEdges() {
  const svg = document.getElementById('cgSvg'), zi = document.getElementById('cgZoomInner');
  if (!svg || !zi) return;
  svg.setAttribute('width', zi.scrollWidth); svg.setAttribute('height', zi.scrollHeight); svg.innerHTML = '';
  const visibleCodes = new Set(cgVisibleNodes().map(n => n.code));
  const colorMap = { hard: 'var(--teal)', weak: 'var(--circuit)', co: 'var(--pulse)' };
  const dashMap = { hard: 'none', weak: '5,4', co: '1,4' };
  const chainSet = cgSelected ? cgChain(cgSelected) : null;
  SEED.prereqs.forEach(e => {
    const from = e.from_code, to = e.to_code, type = e.type;
    if (!visibleCodes.has(from) || !visibleCodes.has(to)) return;
    const fromEl = document.getElementById(`cgnode-${from}`), toEl = document.getElementById(`cgnode-${to}`);
    if (!fromEl || !toEl || fromEl.classList.contains('catoff') || toEl.classList.contains('catoff')) return;
    const fr = cgOffsetRel(fromEl, zi), tr = cgOffsetRel(toEl, zi);
    const x1=fr.x+fr.w, y1=fr.y+fr.h/2, x2=tr.x, y2=tr.y+tr.h/2, midX=(x1+x2)/2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke', colorMap[type]);
    path.setAttribute('stroke-width', type==='hard'?'2':'1.5'); path.setAttribute('stroke-dasharray', dashMap[type]);
    const involved = chainSet && chainSet.has(from) && chainSet.has(to);
    path.setAttribute('opacity', chainSet ? (involved?'0.9':'0.06') : '0.55');
    if (involved) path.setAttribute('stroke-width', type==='hard'?'3':'2.5');
    svg.appendChild(path);
  });
}

<script>
/* ============ LOGIN ============ */
async function doLogin(username, password) {
  const u = USERS.find(x => x.username === username && x.password === password);
  if (!u) return { error: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' };
  const session = { id: u.id, username: u.username, role: u.role, full_name: u.full_name };
  STATE.session = session;
  await storeSet('sm3-session', session);
  STATE.route = 'home';
  render();
  return {};
}
async function doLogout() {
  STATE.session = null;
  await storeDelete('sm3-session');
  STATE.route = 'public';
  render();
}

function renderLogin() {

  }
  if (STATE.route === 'login') { app.innerHTML = renderLogin(); wireLogin(); return; }
  renderPublicSite();

function renderPage() {
  const el = document.getElementById('pageContent');

/* ============ ADMIN: SKILLS ============ */
let adminSkillsTab = 'list';
/* ============ ADMIN: COURSES (หลักสูตร & รายวิชา) ============ */
PAGE_RENDERERS['admin:courses'] = function (el) {
  el.innerHTML = `
    <div class="page-head"><h2>หลักสูตร &amp; รายวิชา</h2></div>
    <p class="lede">จัดการข้อมูลรายวิชาในหลักสูตร — เพิ่ม แก้ไข หรือลบรายวิชา</p>
    <div class="toolbar">
      <input id="courseAdminSearch" placeholder="ค้นหารหัสวิชา หรือชื่อวิชา…" style="flex:1; min-width:200px; padding:8px 12px; border:1px solid var(--line); border-radius:8px;">
      <button class="btn btn-primary btn-sm" id="btnAddCourse">+ เพิ่มรายวิชา</button>
    </div>
    <div id="courseAdminCount" style="font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin:8px 0;"></div>
    <div class="card" style="padding:0; overflow-x:auto;"><table class="data-table">
      <thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา (ไทย)</th><th>English</th><th>หน่วยกิต</th><th>กลุ่มวิชา</th><th style="width:100px;">จัดการ</th></tr></thead>
      <tbody id="courseAdminRows"></tbody>
    </table></div>
    <div id="courseModalRoot"></div>`;
  let search = '';
  function draw() {
    const s = search.trim().toLowerCase();
    const filtered = SEED.courses.filter(c => !s || c.code.toLowerCase().includes(s) || c.th_name.toLowerCase().includes(s));
    document.getElementById('courseAdminCount').textContent = `พบ ${filtered.length} รายวิชา จากทั้งหมด ${SEED.courses.length} รายวิชา`;
    document.getElementById('courseAdminRows').innerHTML = filtered.map(c => `
      <tr>
        <td><span class="chip">${c.code}</span></td>
        <td>${escapeHtml(c.th_name)}</td>
        <td style="font-style:italic; color:var(--ink-soft);">${escapeHtml(c.en_name || '')}</td>
        <td style="font-family:var(--font-mono); font-size:12px;">${c.credit_text || ''}</td>
        <td>${c.group_code ? `<span class="chip">${escapeHtml((SEED.groups.find(g => g.code === c.group_code) || {}).label || c.group_code)}</span>` : '—'}</td>
        <td><div style="display:flex; gap:5px;"><button class="btn btn-ghost btn-sm" data-cedit="${c.code}">แก้ไข</button><button class="btn btn-danger btn-sm" data-cdel="${c.code}">ลบ</button></div></td>
      </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">ไม่พบรายวิชา</div></td></tr>`;
    document.querySelectorAll('[data-cedit]').forEach(b => b.addEventListener('click', () => openCourseModal(SEED.courses.find(c => c.code === b.dataset.cedit))));
    document.querySelectorAll('[data-cdel]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('ลบรายวิชานี้? การแมปทักษะและ CLO ที่เกี่ยวข้องจะถูกลบไปด้วย')) return;
      const code = b.dataset.cdel;
      SEED.courses = SEED.courses.filter(c => c.code !== code);
      STATE.courseSkills = STATE.courseSkills.filter(m => m.course_code !== code);
      delete COURSE_LOOKUP[code];
      await persist('sm3-course-skills', 'courseSkills');
      draw();
    }));
  }
  document.getElementById('courseAdminSearch').addEventListener('input', e => { search = e.target.value; draw(); });
  document.getElementById('btnAddCourse').addEventListener('click', () => openCourseModal(null));
  draw();

  function openCourseModal(course) {
    const isEdit = !!course;
    const root = document.getElementById('courseModalRoot');
    root.innerHTML = `
    <div class="modal-overlay"><div class="modal-box">
      <h3>${isEdit ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชาใหม่'}</h3>

        <div class="field"><label>รหัสวิชา *</label><input id="cf-code" value="${isEdit ? escapeHtml(course.code) : ''}" ${isEdit ? 'readonly' : ''} required></div>

        <div class="field"><label>หน่วยกิต เช่น 3(2-2-5)</label><input id="cf-credit" value="${isEdit ? escapeHtml(course.credit_text || '') : ''}"></div>

        </div>
        <div class="field"><label>คำอธิบายรายวิชา (ไทย)</label><textarea id="cf-thdesc">${isEdit ? escapeHtml(course.th_desc || '') : ''}</textarea></div>
        <div class="field"><label>Course Description (English)</label><textarea id="cf-endesc">${isEdit ? escapeHtml(course.en_desc || '') : ''}</textarea></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" id="courseCancel">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึก</button></div>
      </form>
    </div></div>`;
    document.getElementById('courseCancel').addEventListener('click', () => root.innerHTML = '');
    document.getElementById('courseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('cf-code').value.trim();
      const th_name = document.getElementById('cf-th').value.trim();
      if (!code || !th_name) return;
      if (!isEdit && SEED.courses.some(c => c.code === code)) { alert('รหัสวิชานี้มีอยู่แล้ว'); return; }
      const data = {
        code, th_name,
        en_name: document.getElementById('cf-en').value.trim(),
        credit_text: document.getElementById('cf-credit').value.trim(),
        group_code: document.getElementById('cf-group').value || null,
        th_desc: document.getElementById('cf-thdesc').value.trim(),
        en_desc: document.getElementById('cf-endesc').value.trim(),
      };
      if (isEdit) {
        SEED.courses = SEED.courses.map(c => c.code === course.code ? { ...c, ...data } : c);
      } else {
        SEED.courses.push({ id: Math.max(0, ...SEED.courses.map(c => c.id)) + 1, year_no: null, sem_no: null, ...data });
      }
      COURSE_LOOKUP[code] = SEED.courses.find(c => c.code === code);
      root.innerHTML = ''; draw();
    });
  }
};
PAGE_RENDERERS['admin:skills'] = function (el) {

function renderSkillsList(body) {

    <div class="toolbar"><button class="btn btn-primary btn-sm" id="btnAddSkill">+ เพิ่มทักษะ</button></div>

      <tbody id="skillsRows"></tbody>
    </table></div>
    <div id="skillModalRoot"></div>`;

    document.getElementById('skillsRows').innerHTML = STATE.skills.map(s => `
      <tr><td>${escapeHtml(s.name)}</td><td>${s.category ? `<span class="chip">${escapeHtml(s.category)}</span>` : '—'}</td>

/* ============ ADMIN: USERS ============ */
const ROLE_LABELS = {
  admin: 'ผู้ดูแลระบบ (จัดการข้อมูลได้ทั้งหมด)',
  teacher: 'อาจารย์ (จัดการ Skill Mapping ของวิชาที่สอน)',
  student: 'นักศึกษา (บันทึกผลการเรียน/ดู Skill ของตนเอง)',

PAGE_RENDERERS['admin:users'] = function (el) {
  el.innerHTML = `
    <div class="page-head"><h2>ผู้ใช้งานระบบ</h2></div>
    <p class="lede">จัดการบัญชีผู้ใช้งานในระบบ — เพิ่ม แก้ไข หรือลบผู้ใช้ (การเปลี่ยนแปลงจะมีผลกับข้อมูลในเดโมนี้เท่านั้น)</p>
    <div class="toolbar"><button class="btn btn-primary btn-sm" id="btnAddUser">+ เพิ่มผู้ใช้งาน</button></div>
    <div class="card" style="padding:0; overflow-x:auto;"><table class="data-table">
      <thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อเต็ม</th><th>สิทธิ์</th><th style="width:120px;">จัดการ</th></tr></thead>
      <tbody id="userAdminRows"></tbody>
    </table></div>
    <div id="userModalRoot"></div>`;

  function draw() {
    document.getElementById('userAdminRows').innerHTML = USERS.map(u => `
      <tr>
        <td>${escapeHtml(u.username)}</td>
        <td>${escapeHtml(u.full_name)}</td>
        <td><span class="role-badge ${u.role}">${u.role}</span></td>
        <td><div style="display:flex; gap:5px;">
          <button class="btn btn-ghost btn-sm" data-uedit="${u.id}">แก้ไข</button>
          <button class="btn btn-danger btn-sm" data-udel="${u.id}">ลบ</button>
        </div></td>
      </tr>`).join('') || `<tr><td colspan="4"><div class="empty-state">ยังไม่มีผู้ใช้งาน</div></td></tr>`;
    document.querySelectorAll('[data-uedit]').forEach(b => b.addEventListener('click', () => openUserModal(USERS.find(u => u.id === Number(b.dataset.uedit)))));
    document.querySelectorAll('[data-udel]').forEach(b => b.addEventListener('click', async () => {
      const id = Number(b.dataset.udel);
      if (STATE.session && STATE.session.id === id) { alert('ไม่สามารถลบบัญชีของตนเองได้'); return; }
      const target = USERS.find(u => u.id === id);
      if (!confirm(`ลบผู้ใช้ "${target?.username}"? ${target?.role === 'teacher' ? 'การมอบหมายรายวิชาของอาจารย์คนนี้จะถูกลบไปด้วย' : ''}`)) return;
      USERS = USERS.filter(u => u.id !== id);
      STATE.teacherCourses = STATE.teacherCourses.filter(a => a.teacher_user_id !== id);
      await storeSet('sm-users', USERS);
      await persist('sm3-teacher-courses', 'teacherCourses');
      draw();
    }));
  }
  document.getElementById('btnAddUser').addEventListener('click', () => openUserModal(null));
  draw();

  function openUserModal(user) {
    const isEdit = !!user;
    const root = document.getElementById('userModalRoot');
    root.innerHTML = `
    <div class="modal-overlay"><div class="modal-box">
      <h3>${isEdit ? `แก้ไขผู้ใช้: ${escapeHtml(user.username)}` : 'เพิ่มผู้ใช้งานใหม่'}</h3>
      <form id="userForm">
        <div class="field"><label>ชื่อผู้ใช้ *</label><input id="uf-username" value="${isEdit ? escapeHtml(user.username) : ''}" ${isEdit ? 'readonly' : ''} required></div>
        <div class="field"><label>รหัสผ่าน ${isEdit ? '(เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยน)' : '* (อย่างน้อย 6 ตัวอักษร)'}</label><input type="password" id="uf-password" minlength="6" ${isEdit ? '' : 'required'}></div>
        <div class="field"><label>ชื่อเต็ม</label><input id="uf-fullname" value="${isEdit ? escapeHtml(user.full_name || '') : ''}"></div>
        <div class="field"><label>สิทธิ์การใช้งาน</label>
          <select id="uf-role">
            ${Object.entries(ROLE_LABELS).map(([v, l]) => `<option value="${v}" ${isEdit && user.role === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" id="userCancel">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึก</button></div>
      </form>
    </div></div>`;
    document.getElementById('userCancel').addEventListener('click', () => root.innerHTML = '');
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('uf-username').value.trim();
      const password = document.getElementById('uf-password').value;
      const full_name = document.getElementById('uf-fullname').value.trim();
      const role = document.getElementById('uf-role').value;
      if (!username) return;
      if (!isEdit) {
        if (USERS.some(u => u.username === username)) { alert('ชื่อผู้ใช้นี้มีอยู่แล้ว'); return; }
        if (password.length < 6) { alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
        USERS = [...USERS, { id: STATE._nextId.user++, username, password, full_name, role }];
      } else {
        if (password && password.length < 6) { alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
        USERS = USERS.map(u => u.id === user.id ? { ...u, full_name, role, ...(password ? { password } : {}) } : u);
        if (STATE.session && STATE.session.id === user.id) {
          STATE.session = { ...STATE.session, full_name, role };
          await storeSet('sm3-session', STATE.session);
        }
      }
      await storeSet('sm-users', USERS);
      root.innerHTML = ''; draw();
    });
  }
};

/* ============ TEACHER: SKILL MAPPING (scoped to own courses) ============ */
PAGE_RENDERERS['teacher:skill-mapping'] = function (el) {
  const myCourses = myAssignedCourses();
  let selectedCourse = '';
  el.innerHTML = `
    <div class="page-head"><h2>กำหนด / ตรวจสอบ CLO และเชื่อมโยงกับ Skill</h2></div>
    <p class="lede">เลือกรายวิชาที่รับผิดชอบ เพื่อตรวจสอบ CLO และกำหนดทักษะที่เชื่อมโยง</p>
    <div class="field" style="max-width:420px;"><label>รายวิชาที่สอน</label>
      <select id="tcCourseSel"><option value="">— เลือกรายวิชา —</option>${myCourses.map(c => `<option value="${c.code}">${c.code} — ${c.th_name}</option>`).join('')}</select>
    </div>
    <div id="tcDetail"></div>`;
  document.getElementById('tcCourseSel').addEventListener('change', e => { selectedCourse = e.target.value; draw(); });
  function draw() {
    const detail = document.getElementById('tcDetail');
    if (!selectedCourse) { detail.innerHTML = ''; return; }
    const clos = SEED.clos.filter(c => c.course_code === selectedCourse);
    const mapped = STATE.courseSkills.filter(m => m.course_code === selectedCourse);
    detail.innerHTML = `
      <div class="card" style="margin:16px 0;">
        <h3 style="font-size:14px; margin-bottom:10px;">CLO ของวิชานี้</h3>
        ${clos.length === 0 ? '<div class="empty-state">ยังไม่มี CLO สำหรับวิชานี้</div>' :
          clos.map(c => `<div style="padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px;"><span class="chip" style="margin-right:8px;">${c.ksec}</span>${escapeHtml(c.text)}</div>`).join('')}
      </div>
      <div class="card">
        <h3 style="font-size:14px; margin-bottom:12px;">ทักษะที่เชื่อมโยงกับวิชานี้</h3>
        <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap;">
          <div class="field" style="margin-bottom:0; flex:1 1 220px;"><label>เพิ่มทักษะ</label>
            <select id="tcSkillSel"><option value="">— เลือกทักษะ —</option>${STATE.skills.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
          <div class="field" style="margin-bottom:0; width:110px;"><label>น้ำหนัก</label><input type="number" id="tcWeight" min="1" max="5" value="3"></div>
          <button class="btn btn-accent" id="tcAddMap">+ เพิ่ม</button>
        </div>
        ${mapped.length === 0 ? '<div class="empty-state">ยังไม่มีทักษะที่แมป</div>' : `
        <table class="data-table"><thead><tr><th>ทักษะ</th><th>น้ำหนัก</th><th style="width:70px;"></th></tr></thead><tbody>
          ${mapped.map(m => { const sk = STATE.skills.find(s => s.id === m.skill_id) || { name: '(ลบแล้ว)' };
            return `<tr><td>${escapeHtml(sk.name)}</td><td>${'●'.repeat(m.weight)}${'○'.repeat(5 - m.weight)}</td><td><button class="btn btn-danger btn-sm" data-tcunmap="${m.id}">ลบ</button></td></tr>`;
          }).join('')}
        </tbody></table>`}
      </div>`;
    document.getElementById('tcAddMap').addEventListener('click', async () => {
      const skillId = Number(document.getElementById('tcSkillSel').value);
      const weight = Math.max(1, Math.min(5, Number(document.getElementById('tcWeight').value) || 3));
      if (!skillId) return;
      const existing = STATE.courseSkills.find(m => m.course_code === selectedCourse && m.skill_id === skillId);
      if (existing) existing.weight = weight;
      else STATE.courseSkills.push({ id: STATE._nextId.courseSkill++, course_code: selectedCourse, skill_id: skillId, weight });
      await persist('sm3-course-skills', 'courseSkills'); draw();
    });
    detail.querySelectorAll('[data-tcunmap]').forEach(b => b.addEventListener('click', async () => {
      STATE.courseSkills = STATE.courseSkills.filter(m => m.id !== Number(b.dataset.tcunmap));
      await persist('sm3-course-skills', 'courseSkills'); draw();
    }));
  }
};

/* ============ TEACHER: GAP STUDENTS ============ */
PAGE_RENDERERS['teacher:gap-students'] = function (el) {
  const students = USERS.filter(u => u.role === 'student');
  const totalSkills = STATE.skills.length;
  const rows = students.map(s => {
    const completedCodes = new Set((STATE.progress[s.id] || []).filter(p => p.status === 'completed').map(p => p.course_code));
    const achievedIds = new Set(STATE.courseSkills.filter(cs => completedCodes.has(cs.course_code)).map(cs => cs.skill_id));
    const missingSkills = STATE.skills.filter(sk => !achievedIds.has(sk.id));
    const levels = STATE.skills.filter(sk => achievedIds.has(sk.id)).map(sk => {
      const ws = STATE.courseSkills.filter(cs => cs.skill_id === sk.id && completedCodes.has(cs.course_code)).map(cs => cs.weight);
      return ws.length ? Math.max(...ws) : 0;
    });
    const avgLevel = levels.length ? (levels.reduce((a, b) => a + b, 0) / levels.length) : 0;
    return { ...s, completed_courses: completedCodes.size, achieved: achievedIds.size, missing: missingSkills, avgLevel };
  }).sort((a, b) => b.missing.length - a.missing.length);

  el.innerHTML = `
    <div class="page-head"><h2>นักศึกษาที่ Skill ยังไม่ถึงเป้าหมาย</h2></div>
    <p class="lede">เรียงตามจำนวนทักษะที่ยังขาด (จากทั้งหมด ${totalSkills} ทักษะ) — คำนวณจากผลการเรียนจริงของนักศึกษาแต่ละคนที่บันทึกไว้ในระบบ ระดับทักษะเฉลี่ยใช้สเกล 1–5</p>
    <div class="card" style="padding:0; overflow-x:auto;"><table class="data-table">
      <thead><tr><th>ชื่อ-สกุล</th><th>วิชาที่เรียนจบแล้ว</th><th>Skill ที่มีแล้ว</th><th>ระดับเฉลี่ย (1-5)</th><th>Skill ที่ยังขาด</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          <td>${escapeHtml(r.full_name)} <span style="color:var(--ink-faint); font-size:11px;">(${r.username})</span></td>
          <td style="text-align:center;">${r.completed_courses}</td>
          <td style="text-align:center;">${r.achieved} / ${totalSkills}</td>
          <td style="text-align:center; white-space:nowrap;">${r.avgLevel > 0 ? `${levelDotsHtml(r.avgLevel)} <span style="font-size:11px; color:var(--ink-faint);">${r.avgLevel.toFixed(1)}</span>` : '<span style="font-size:11px; color:var(--ink-faint);">—</span>'}</td>
          <td><span class="chip" style="background:${r.missing.length > 0 ? '#FBEAE5' : 'var(--teal-pale)'}; color:${r.missing.length > 0 ? '#B8401F' : 'var(--teal-deep)'};">${r.missing.length} ทักษะ</span>
              ${r.missing.length > 0 ? `<div style="font-size:11px; color:var(--ink-faint); margin-top:4px;">${r.missing.map(m => escapeHtml(m.name)).join(', ')}</div>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
};
</script>

<script>

function myCompletedCodes() { return new Set(myProgress().filter(p => p.status === 'completed').map(p => p.course_code)); }

        </div>
        <div class="stu-hero-meta">
          <div><b>${earnedCredit}</b> / ${totalCredit} หน่วยกิต</div>
          ${gpa != null ? `<div>เกรดเฉลี่ยสะสม <b>${gpa.toFixed(2)}</b></div>` : ''}
          <div>${completed} วิชาเรียนจบ · ${inProgress} วิชากำลังเรียน</div>

      </div>
    </div>
    <div class="stu-quick-grid">

        <h3>ผลการเรียน / รายวิชา</h3>
        <p>ดูสถานะรายวิชาทั้งหมดและทักษะที่ได้รับจากแต่ละวิชา</p>
      </button>
      <button class="stu-quick-card accent" data-goto="skill-transcript">
        <div class="qc-icon">🏅</div>
        <h3>Skill Transcript</h3>
        <p>สรุปทักษะที่ผ่านเกณฑ์แล้ว และทักษะที่ควรพัฒนาเพิ่มเติม</p>
      </button>
      <button class="stu-quick-card ghost" data-goto="career-path">
        <div class="qc-icon">🧭</div>
        <h3>เส้นทางสู่อาชีพ</h3>
        <p>เลือกตำแหน่งงานที่สนใจ ดูว่าทักษะของคุณพร้อมแล้วแค่ไหน</p>
      </button>
      <button class="stu-quick-card ghost" data-goto="skill-mapping">
        <div class="qc-icon">🎯</div>
        <h3>Skill Mapping (PLO)</h3>
        <p>เทียบทักษะที่เรียนรู้กับผลลัพธ์การเรียนรู้ระดับหลักสูตร</p>
      </button>
    </div>`;
  el.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.goto)));

/* ============ STUDENT: PROGRESS (course checklist) ============ */
const STATUS_LABEL = { planned: 'วางแผนจะเรียน', in_progress: 'กำลังเรียน', completed: 'เรียนจบแล้ว' };
PAGE_RENDERERS['student:progress'] = function (el) {
  let search = '', groupFilter = '', statusFilter = '';
  const prog0 = myProgress();
  const totalCourses = SEED.courses.length;
  const completedCount = prog0.filter(p => p.status === 'completed').length;
  const coursePct = totalCourses ? Math.round((completedCount / totalCourses) * 100) : 0;

  el.innerHTML = `
    <div class="page-head"><h2>ผลการเรียน / รายวิชา</h2></div>
    <p class="lede">สถานะรายวิชาตามผลการเรียนจริงของคุณ — ระบบรวมทักษะที่ได้รับจากรายวิชาที่เรียนจบแล้วให้อัตโนมัติ</p>
    <div class="card" style="margin-bottom:16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <div class="stu-plo-ring" style="width:58px; height:58px;">
        ${ringSVG(coursePct, { size: 58, stroke: 6 })}<span>${coursePct}%</span>
      </div>
      <div style="flex:1; min-width:180px;">
        <div style="font-size:13.5px; font-weight:600; margin-bottom:2px;">เรียนจบแล้ว ${completedCount} จาก ${totalCourses} รายวิชาในหลักสูตร</div>
        <div style="font-size:12px; color:var(--ink-soft);">คลิกที่หัวข้อด้านล่างเพื่อดูทักษะที่สะสมได้จากรายวิชาที่เรียนจบแล้ว</div>
      </div>
    </div>
    <div id="progSkillsSummary"></div>
    <div class="toolbar" style="margin-top:20px;">
      <input id="progSearch" placeholder="🔍 ค้นหารหัสวิชา หรือชื่อวิชา…" style="flex:1 1 220px; padding:8px 12px; border:1px solid var(--line); border-radius:100px;">
      <select id="progGroupFilter" style="padding:8px 10px; border:1px solid var(--line); border-radius:8px;">
        <option value="">ทุกหมวดวิชา</option>${SEED.groups.map(g => `<option value="${g.code}">${g.label}</option>`).join('')}
      </select>
      <select id="progStatusFilter" style="padding:8px 10px; border:1px solid var(--line); border-radius:8px;">
        <option value="">ทุกสถานะ</option>
        <option value="completed">เรียนจบแล้ว</option>
        <option value="in_progress">กำลังเรียน</option>
        <option value="planned">วางแผนจะเรียน</option>
        <option value="none">ยังไม่ได้ลงทะเบียน</option>
      </select>
    </div>
    <div id="progCount" style="font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin:2px 0 8px;"></div>
    <div class="card" style="padding:0; overflow-x:auto;"><table class="data-table">
      <thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา</th><th style="width:130px;">สถานะ</th><th style="width:70px;">เกรด</th><th>ทักษะที่ได้จากวิชานี้</th></tr></thead>
      <tbody id="progRows"></tbody>
    </table></div>`;

  function drawSummary() {
    const completedCodes = myCompletedCodes();
    const bySkill = {};
    STATE.courseSkills.forEach(cs => {
      if (!completedCodes.has(cs.course_code)) return;
      const sk = STATE.skills.find(s => s.id === cs.skill_id); if (!sk) return;
      if (!bySkill[sk.id]) bySkill[sk.id] = { name: sk.name, category: sk.category, total: 0, count: 0 };
      bySkill[sk.id].total += cs.weight; bySkill[sk.id].count++;
    });
    const list = Object.values(bySkill).sort((a, b) => b.total - a.total);
    const maxTotal = Math.max(1, ...list.map(s => s.total));
    document.getElementById('progSkillsSummary').innerHTML = `
      <div class="card" style="margin-bottom:18px;">
        <div class="stu-section-title"><div class="ic">🧩</div><h3>ทักษะที่สะสมได้จากรายวิชาที่เรียนจบแล้ว</h3></div>
        ${list.length === 0 ? '<div class="empty-state">ยังไม่มีทักษะสะสม</div>' : list.map(s => `
          <div style="margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;"><span><b>${escapeHtml(s.name)}</b></span><span style="color:var(--ink-faint); font-family:var(--font-mono); font-size:11px;">${s.count} วิชา</span></div>
            <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${(s.total / maxTotal) * 100}%;"></div></div>
          </div>`).join('')}
      </div>`;
  }

  function drawRows() {
    const prog = Object.fromEntries(myProgress().map(p => [p.course_code, p]));
    const filtered = SEED.courses.filter(c => {
      const s = search.trim().toLowerCase();
      const matchS = !s || c.code.toLowerCase().includes(s) || c.th_name.toLowerCase().includes(s);
      const matchG = !groupFilter || c.group_code === groupFilter;
      const st = prog[c.code] ? prog[c.code].status : 'none';
      const matchSt = !statusFilter || st === statusFilter;
      return matchS && matchG && matchSt;
    });
    document.getElementById('progCount').textContent = `พบ ${filtered.length} รายวิชา จากทั้งหมด ${totalCourses} รายวิชา`;
    document.getElementById('progRows').innerHTML = filtered.map(c => {
      const p = prog[c.code];
      const skillsForCourse = STATE.courseSkills
        .filter(cs => cs.course_code === c.code)
        .map(cs => STATE.skills.find(s => s.id === cs.skill_id))
        .filter(Boolean);
      const skillsHtml = p && p.status === 'completed'
        ? (skillsForCourse.length
            ? skillsForCourse.map(sk => `<span class="chip-sm" style="margin:2px 4px 2px 0;">${escapeHtml(sk.name)}</span>`).join('')
            : `<span style="font-size:12px; color:var(--ink-faint);">ยังไม่มีการแมปทักษะสำหรับวิชานี้</span>`)
        : `<span style="font-size:12px; color:var(--ink-faint);">—</span>`;
      return `<tr><td><span class="chip">${c.code}</span></td><td>${escapeHtml(c.th_name)}</td>
      <td>${statusBadgeHtml(p ? p.status : 'none')}</td>
      <td>${gradeBadgeHtml(p && p.grade)}</td>
      <td>${skillsHtml}</td></tr>`;
    }).join('');
  }
  document.getElementById('progSearch').addEventListener('input', e => { search = e.target.value; drawRows(); });
  document.getElementById('progGroupFilter').addEventListener('change', e => { groupFilter = e.target.value; drawRows(); });
  document.getElementById('progStatusFilter').addEventListener('change', e => { statusFilter = e.target.value; drawRows(); });
  drawSummary(); drawRows();
};

/* ============ STUDENT: SKILL MAPPING (PLO view) ============ */
PAGE_RENDERERS['student:skill-mapping'] = function (el) {
  const completedCodes = myCompletedCodes();
  const ploCards = SEED.plos.map(plo => {
    const coursesForPlo = new Set(SEED.clos.filter(c => { try { return JSON.parse(c.plo_json || '[]').includes(plo.no); } catch { return false; } }).map(c => c.course_code));
    const relevantSkillIds = new Set(STATE.courseSkills.filter(m => coursesForPlo.has(m.course_code)).map(m => m.skill_id));
    const rows = [...relevantSkillIds].map(skillId => {
      const rowsForSkill = STATE.courseSkills.filter(m => m.skill_id === skillId);
      const achievedRows = rowsForSkill.filter(m => completedCodes.has(m.course_code));
      const achieved = achievedRows.length > 0;
      const weight = achieved ? Math.max(...achievedRows.map(r => r.weight)) : Math.max(...rowsForSkill.map(r => r.weight));
      const sk = STATE.skills.find(s => s.id === skillId);
      return { name: sk ? sk.name : '?', achieved, weight };
    }).sort((a, b) => (b.achieved - a.achieved) || (b.weight - a.weight));
    const pct = rows.length ? Math.round((rows.filter(r => r.achieved).length / rows.length) * 100) : 0;
    return `<div class="stu-plo-card">
      <div class="stu-plo-head">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;">
          <span class="chip">PLO ${plo.no}</span>
          <b style="font-size:13.5px;">${escapeHtml(plo.title)}</b>
        </div>
        ${rows.length > 0 ? `<div class="stu-plo-ring">${ringSVG(pct)}<span>${pct}%</span></div>` : ''}
      </div>
      ${rows.length === 0 ? '<div style="font-size:12.5px; color:var(--ink-faint);">ยังไม่มีทักษะที่เชื่อมโยงกับ PLO นี้ในระบบ</div>' :
        `<div style="display:flex; gap:8px; flex-wrap:wrap;">${rows.map(r => `<span class="skill-chip ${r.achieved ? 'ok' : 'gap'}" style="display:inline-flex; align-items:center; gap:6px;">${r.achieved ? '✓' : '⚠'} ${escapeHtml(r.name)} ${levelDotsHtml(r.weight)}${r.achieved ? levelBadgeHtml(r.weight) : `<b style="font-size:10px; white-space:nowrap; color:var(--ink-faint);">ต้องการ Lv.${r.weight}</b>`}</span>`).join('')}</div>`}
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="page-head"><h2>Skill Mapping — เทียบทักษะที่เรียนรู้กับ PLO</h2></div>
    <p class="lede">ระบบเชื่อมโยง CLO ของแต่ละรายวิชาที่เรียนแล้ว เข้ากับทักษะ (Skill) แล้วเปรียบเทียบกับผลลัพธ์การเรียนรู้ระดับหลักสูตร (PLO) — วงกลมแสดงสัดส่วนทักษะที่ทำได้แล้วของ PLO แต่ละข้อ</p>
    ${ploCards}`;
};

/* ============ STUDENT: SKILL TRANSCRIPT ============ */
function stuTranscriptBlock() {
  const summary = SEED.transcript_summary;
  if (!summary) return '';
  const prog = myProgress();
  const byTerm = {};
  prog.forEach(p => {
    if (!p.academic_year) return;
    const k = p.academic_year + '/' + p.semester;
    (byTerm[k] = byTerm[k] || []).push(p);
  });
  const termsHtml = summary.terms.map(t => {
    const k = t.academic_year + '/' + t.semester;
    const rows = (byTerm[k] || []).sort((a, b) => a.course_code.localeCompare(b.course_code));
    return `<div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <h4 style="font-size:13px;">ภาคการศึกษาที่ ${t.semester} ปีการศึกษา ${t.academic_year}</h4>
        <span style="font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);">${t.credits_earned}/${t.credits_registered} นก. · เกรดเฉลี่ย ${t.gpa.toFixed(2)}</span>
      </div>
      <table class="data-table" style="width:100%;">
        <thead><tr><th>รหัสวิชา</th><th>ชื่อวิชา</th><th style="text-align:right;">เกรด</th></tr></thead>
        <tbody>${rows.map(r => {
          const c = COURSE_LOOKUP[r.course_code];
          return `<tr><td style="font-family:var(--font-mono); font-size:11px; color:var(--teal);">${r.course_code}</td><td>${c ? escapeHtml(c.th_name) : ''}</td><td style="text-align:right;">${gradeBadgeHtml(r.grade)}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }).join('');
  return `<div class="page-head" style="margin-bottom:6px;"><h2>ใบแสดงผลการเรียน (Transcript)</h2></div>
    <p class="lede">ข้อมูลจริงจากใบแสดงประวัติการศึกษาของนักศึกษา สะสม ${summary.cumulative_credits} หน่วยกิต เกรดเฉลี่ยสะสม ${summary.cumulative_gpa.toFixed(2)}</p>
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card"><div class="n">${summary.cumulative_credits}</div><div class="lbl">หน่วยกิตสะสม</div></div>
      <div class="stat-card"><div class="n">${summary.cumulative_gpa.toFixed(2)}</div><div class="lbl">เกรดเฉลี่ยสะสม</div></div>
      <div class="stat-card"><div class="n">${summary.terms.length}</div><div class="lbl">ภาคการศึกษาที่ผ่านมา</div></div>
    </div>
    ${termsHtml}`;
}
// Skill Level scale: 1-5, computed from the highest course_skills.weight among
// the student's completed courses that map to that skill (real data, not fabricated).
const SKILL_LEVEL_LABELS = { 0: 'ยังไม่มีข้อมูล', 1: 'เริ่มต้น', 2: 'พื้นฐาน', 3: 'ปานกลาง', 4: 'ดี', 5: 'ชำนาญ' };
function skillLevelForStudent(skillId, completedCodes) {
  const weights = STATE.courseSkills.filter(m => m.skill_id === skillId && completedCodes.has(m.course_code)).map(m => m.weight);
  if (!weights.length) return null;
  const maxW = Math.max(...weights);
  return { level: maxW, label: SKILL_LEVEL_LABELS[maxW] || '' };
}
// Color scale for Skill Level 1-5 (low -> high), used to make level badges scannable at a glance.
const LEVEL_COLORS = { 1: '#C94A4A', 2: '#D98A2B', 3: '#C9970B', 4: '#6FA83C', 5: '#0F8A4C' };
function levelColorFor(level) { return LEVEL_COLORS[Math.max(1, Math.min(5, Math.round(level) || 1))]; }
function levelDotsHtml(level, opts) {
  opts = opts || {};
  const max = 5;
  const size = opts.size || 8;
  const filled = Math.max(0, Math.min(max, Math.round(level)));
  const color = opts.color || levelColorFor(filled || 1);
  let dots = '';
  for (let i = 1; i <= max; i++) {
    dots += `<span style="display:inline-block; width:${size}px; height:${size}px; border-radius:50%; margin-right:2px; background:${i <= filled ? color : 'var(--line)'};"></span>`;
  }
  return `<span style="display:inline-flex; align-items:center; vertical-align:middle;" title="ระดับทักษะ ${filled}/5">${dots}</span>`;
}
function levelBadgeHtml(level, opts) {
  opts = opts || {};
  const color = levelColorFor(level);
  const label = opts.label !== undefined ? opts.label : '';
  return `<b style="font-size:10px; color:${color}; background:${color}1F; border:1px solid ${color}40; border-radius:4px; padding:1px 6px; white-space:nowrap;">Lv.${level}${label ? ' ' + escapeHtml(label) : ''}</b>`;
}
function skillChipWithLevel(s, completedCodes) {
  const lvl = skillLevelForStudent(s.id, completedCodes);
  return `<span class="skill-chip ok" style="display:inline-flex; align-items:center; gap:6px;">${escapeHtml(s.name)}${lvl ? `${levelDotsHtml(lvl.level)}${levelBadgeHtml(lvl.level, { label: lvl.label })}` : ''}</span>`;
}
function skillValueForStudent(skillId, completedCodes) {
  // 0-5 scale: max weight of course_skills for this skill among completed courses, else 0
  const weights = STATE.courseSkills.filter(m => m.skill_id === skillId && completedCodes.has(m.course_code)).map(m => m.weight);
  return weights.length ? Math.max(...weights) : 0;
}
function renderSkillRadarSVG(labels, values, size) {
  size = size || 300;
  const n = labels.length;
  const cx = size / 2, cy = size / 2, R = size * 0.34, maxV = 5;
  const angleFor = i => (-90 + i * (360 / n)) * Math.PI / 180;
  const pt = (i, v) => {
    const r = R * (v / maxV);
    return [cx + r * Math.cos(angleFor(i)), cy + r * Math.sin(angleFor(i))];
  };
  const rings = [1, 2, 3, 4, 5].map(k => {
    const pts = labels.map((_, i) => pt(i, k).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const spokes = labels.map((_, i) => { const [x, y] = pt(i, maxV); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const dataPts = labels.map((_, i) => pt(i, values[i]).join(',')).join(' ');
  const dots = labels.map((_, i) => { const [x, y] = pt(i, values[i]); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--teal-deep)"/>`; }).join('');
  const labelEls = labels.map((lab, i) => {
    const [x, y] = pt(i, maxV + 1.05);
    const anchor = Math.abs(Math.cos(angleFor(i))) < 0.2 ? 'middle' : (Math.cos(angleFor(i)) > 0 ? 'start' : 'end');
    return `<text x="${x}" y="${y}" font-size="10.5" fill="var(--ink-soft)" text-anchor="${anchor}" dominant-baseline="middle">${escapeHtml(lab)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%; max-width:${size}px; display:block; margin:0 auto;">
    ${rings}${spokes}
    <polygon points="${dataPts}" fill="var(--teal)" fill-opacity="0.28" stroke="var(--teal-deep)" stroke-width="2"/>
    ${dots}${labelEls}
  </svg>`;
}
PAGE_RENDERERS['student:skill-transcript'] = function (el) {
  const completedCodes = myCompletedCodes();
  const achievedIds = new Set(STATE.courseSkills.filter(m => completedCodes.has(m.course_code)).map(m => m.skill_id));
  const passed = STATE.skills.filter(s => achievedIds.has(s.id));
  const gap = STATE.skills.filter(s => !achievedIds.has(s.id));
  const passedSpecific = passed.filter(s => s.skill_type !== 'general');
  const passedGeneral = passed.filter(s => s.skill_type === 'general');

  // radar chart: average skill-level (0-5) per category
  const categories = [...new Set(STATE.skills.map(s => s.category || 'อื่น ๆ'))];
  const radarValues = categories.map(cat => {
    const skillsInCat = STATE.skills.filter(s => (s.category || 'อื่น ๆ') === cat);
    const vals = skillsInCat.map(s => skillValueForStudent(s.id, completedCodes));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  });

  const totalSkillCount = STATE.skills.length;
  const readyPct = totalSkillCount ? Math.round((passed.length / totalSkillCount) * 100) : 0;
  el.innerHTML = `
    ${stuTranscriptBlock()}
    <div class="page-head">
      <h2>Skill Transcript</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="stu-plo-ring" style="width:44px; height:44px;">${ringSVG(readyPct, { size: 44, stroke: 5 })}<span>${readyPct}%</span></div>
        <span style="font-size:12px; color:var(--ink-soft);">ทักษะพร้อมแล้ว ${passed.length}/${totalSkillCount}</span>
      </div>
    </div>
    <p class="lede">สรุปทักษะที่ผ่านเกณฑ์แล้ว (พร้อมระดับทักษะที่ทำได้ จากน้ำหนักทักษะสูงสุดของรายวิชาที่เรียนจบ) และทักษะที่ยังต้องพัฒนาเพิ่มเติม</p>
    <div class="card" style="margin-bottom:16px;">
      <h3 style="font-size:14px; margin-bottom:4px; text-align:center;">แผนภูมิเรดาร์ทักษะตามหมวดหมู่</h3>
      <p style="font-size:11.5px; color:var(--ink-faint); text-align:center; margin-bottom:8px;">ค่าเฉลี่ยระดับทักษะ (0-5) ของแต่ละหมวดหมู่ จากรายวิชาที่เรียนจบแล้ว</p>
      ${renderSkillRadarSVG(categories, radarValues)}
    </div>
    <div class="card">
      <div class="stu-section-title"><div class="ic" style="background:#DFF3E6; color:#0F8A4C;">🛠</div><h3 style="color:#0F8A4C;">Specific Skill ที่ผ่านเกณฑ์แล้ว (${passedSpecific.length})</h3></div>
      ${passedSpecific.length === 0 ? '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:20px;">ยังไม่มีทักษะที่ผ่านเกณฑ์</div>' :
        `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;">${passedSpecific.map(s => skillChipWithLevel(s, completedCodes)).join('')}</div>`}
      <div class="stu-section-title"><div class="ic" style="background:#EDE4FB; color:#5B3FB0;">🤝</div><h3 style="color:#5B3FB0;">General Skill / Soft Skill ที่ผ่านเกณฑ์แล้ว (${passedGeneral.length})</h3></div>
      ${passedGeneral.length === 0 ? '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:20px;">ยังไม่มีทักษะที่ผ่านเกณฑ์</div>' :
        `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;">${passedGeneral.map(s => skillChipWithLevel(s, completedCodes)).join('')}</div>`}
      <div class="stu-section-title"><div class="ic" style="background:#FBEAE5; color:#B8401F;">⚠</div><h3 style="color:#B8401F;">ทักษะที่ควรพัฒนาเพิ่มเติม (${gap.length})</h3></div>
      ${gap.length === 0 ? '<div style="font-size:12.5px; color:var(--ink-faint);">ยินดีด้วย — คุณมีทักษะครบทุกรายการแล้ว 🎉</div>' :
        `<div style="display:flex; gap:8px; flex-wrap:wrap;">${gap.map(s => `<span class="skill-chip gap">${escapeHtml(s.name)}${s.skill_type === 'general' ? ' · General' : ''}</span>`).join('')}</div>`}
      <div style="margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); font-size:11px; color:var(--ink-faint);">ระดับทักษะ (Skill Level) ใช้สเกล 1–5: Lv.1 เริ่มต้น · Lv.2 พื้นฐาน · Lv.3 ปานกลาง · Lv.4 ดี · Lv.5 ชำนาญ — คำนวณจากน้ำหนักทักษะสูงสุดของรายวิชาที่เรียนจบแล้วซึ่งเชื่อมโยงกับทักษะนั้น</div>
    </div>`;
};

/* ============ STUDENT: CAREER PATH (Job -> Skill -> Course) ============ */
PAGE_RENDERERS['student:career-path'] = function (el) {
  let selectedJob = '';
  const completedCodes = myCompletedCodes();
  el.innerHTML = `
    <div class="page-head"><h2>เส้นทางสู่อาชีพ (Career Path)</h2></div>
    <p class="lede">เลือกตำแหน่งงานที่สนใจ เพื่อดูว่าต้องมีทักษะใดบ้าง คุณมีทักษะนั้นแล้วหรือยัง และรายวิชาใดจะช่วยให้ได้ทักษะที่ยังขาด — แสดงความสัมพันธ์ <b>อาชีพ → ทักษะ → รายวิชา</b></p>
    <div class="stu-job-grid" id="cpJobGrid">
      ${STATE.jobs.map(j => `
        <button class="stu-job-card" data-job="${j.id}">
          <span class="jt">${escapeHtml(j.title)}</span>
          ${j.category ? `<span class="jc">${escapeHtml(j.category)}</span>` : ''}
        </button>`).join('')}
    </div>
    <div id="cpBody"></div>`;
  document.getElementById('cpJobGrid').addEventListener('click', e => {
    const btn = e.target.closest('[data-job]'); if (!btn) return;
    selectedJob = btn.dataset.job;
    document.querySelectorAll('#cpJobGrid .stu-job-card').forEach(b => b.classList.toggle('active', b === btn));
    draw();
  });
  function draw() {
    const body = document.getElementById('cpBody');
    if (!selectedJob) { body.innerHTML = ''; return; }
    const job = STATE.jobs.find(j => j.id === Number(selectedJob));
    const reqSkills = STATE.jobSkills.filter(m => m.job_id === Number(selectedJob))
      .map(m => ({ ...m, skill: STATE.skills.find(s => s.id === m.skill_id) }))
      .filter(m => m.skill)
      .sort((a, b) => b.importance - a.importance);
    const rows = reqSkills.map(m => {
      const providing = STATE.courseSkills.filter(cs => cs.skill_id === m.skill_id);
      const achieved = providing.some(cs => completedCodes.has(cs.course_code));
      const myLevel = skillValueForStudent(m.skill_id, completedCodes);
      return { ...m, providing, achieved, myLevel };
    });
    const readyCount = rows.filter(r => r.achieved).length;
    const readyPct = rows.length ? Math.round((readyCount / rows.length) * 100) : 0;
    body.innerHTML = `
      <div class="card" style="margin:16px 0; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div class="stu-plo-ring" style="width:58px; height:58px;">${ringSVG(readyPct, { size: 58, stroke: 6 })}<span>${readyPct}%</span></div>
        <div style="flex:1; min-width:200px;">
          <div style="font-size:14px; font-weight:700; color:var(--teal-deep); margin-bottom:2px;">${escapeHtml(job.title)}</div>
          <div style="font-size:12.5px; color:var(--ink-soft);">ทักษะที่พร้อมแล้ว ${readyCount} จาก ${rows.length} ทักษะที่ตำแหน่งนี้ต้องการ</div>
        </div>
      </div>
      ${job.responsibilities ? `<div class="card" style="margin-bottom:16px;"><div style="font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;">หน้าที่ความรับผิดชอบ</div><p style="font-size:13px;">${escapeHtml(job.responsibilities)}</p></div>` : ''}
      ${rows.length === 0 ? '<div class="empty-state">ยังไม่มีการกำหนดทักษะสำหรับตำแหน่งนี้</div>' :
        rows.map(r => `
          <div class="card" style="margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; flex-wrap:wrap; gap:6px;">
              <div><span class="skill-chip ${r.achieved ? 'ok' : 'gap'}" style="margin-right:8px; display:inline-flex; align-items:center; gap:6px;">${r.achieved ? `✓ พร้อมแล้ว` : '⚠ ยังไม่มี'}${r.achieved ? levelDotsHtml(r.myLevel) : ''}</span><b style="font-size:13.5px;">${escapeHtml(r.skill.name)}</b></div>
              <span style="font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);">ความสำคัญ ${'●'.repeat(r.importance)}${'○'.repeat(5 - r.importance)}</span>
            </div>
            ${r.providing.length > 0 ? `<div style="font-size:12px; color:var(--ink-soft);">ได้จากวิชา: ${r.providing.map(p => `<span class="chip" style="background:${completedCodes.has(p.course_code) ? 'var(--teal-pale)' : 'var(--paper-alt)'}; margin-right:4px;">${p.course_code}</span>`).join('')}</div>` : '<div style="font-size:12px; color:var(--ink-faint);">ยังไม่มีรายวิชาที่ให้ทักษะนี้ในระบบ</div>'}
          </div>`).join('')}`;
  }
};
</script>
